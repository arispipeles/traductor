<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Estable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        #display-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0 5%;
            text-align: center;
            cursor: pointer;
        }

        .translation-text {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.4s ease;
            width: 100%;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
        }

        .live-gray-text { 
            color: #444; 
            font-size: 2rem; 
            font-weight: 400;
            margin-bottom: 2rem;
            min-height: 3rem;
        }

        #admin-panel { 
            background: rgba(15, 15, 15, 0.98); 
            border-bottom: 1px solid #333; 
            padding: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000; 
            transition: transform 0.3s;
        }
        
        .panel-hidden { transform: translateY(-100%); }
        
        input, select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="flex flex-col">
        <span class="text-[10px] text-gray-500 font-bold uppercase">Google API Key</span>
        <input type="password" id="apiKeyInput" placeholder="Pega tu llave aquí..." class="w-48">
    </div>

    <div class="flex flex-col">
        <span class="text-[10px] text-gray-500 font-bold uppercase">Idioma</span>
        <select id="languageMode">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <div class="flex flex-col">
        <span class="text-[10px] text-gray-500 font-bold uppercase">Tamaño Letra</span>
        <input type="range" id="sizeSlider" min="5" max="25" value="13" class="w-32">
    </div>

    <button id="btnStart" class="btn bg-green-600 text-white hover:bg-green-500">INICIAR</button>
    <button onclick="togglePanel()" class="btn bg-gray-800 text-gray-400">OCULTAR</button>

    <div id="statusLabel" class="text-xs font-mono bg-gray-900 px-3 py-1 rounded border border-gray-800">
        ESTADO: <span id="statusText" class="text-gray-400">LISTO</span>
    </div>
</div>

<div id="display-area" onclick="togglePanel()">
    <div id="live-original" class="live-gray-text italic">Hable ahora...</div>
    <div id="translated-output" class="translation-text" style="font-size: 13vw;">
        BIENVENIDOS
    </div>
</div>

<script>
let recognition;
let isRecording = false;
let lastTranslationTime = 0;
let textBuffer = "";
const MIN_DELAY = 5000; // 5 segundos entre traducciones para evitar error de cuota

const apiKeyInput = document.getElementById('apiKeyInput');
const liveOriginal = document.getElementById('live-original');
const translatedOutput = document.getElementById('translated-output');
const statusText = document.getElementById('statusText');
const sizeSlider = document.getElementById('sizeSlider');

// Guardar/Cargar API Key
if(localStorage.getItem('church_key_v2')) apiKeyInput.value = localStorage.getItem('church_key_v2');
apiKeyInput.addEventListener('change', (e) => localStorage.setItem('church_key_v2', e.target.value));

// Control de tamaño de letra
sizeSlider.oninput = (e) => {
    translatedOutput.style.fontSize = e.target.value + 'vw';
};

function togglePanel() {
    document.getElementById('admin-panel').classList.toggle('panel-hidden');
}

async function callGemini(text) {
    const key = apiKeyInput.value.trim();
    if (!key || text.trim().length < 8) return;

    const now = Date.now();
    if (now - lastTranslationTime < MIN_DELAY) return;

    lastTranslationTime = now;
    statusText.innerText = "TRADUCIENDO...";
    statusText.className = "text-blue-400";

    const mode = document.getElementById('languageMode').value;
    const target = mode === "es-EN" ? "English" : "Spanish";
    
    const prompt = `Translate this church sermon to ${target}. ONLY provide the translation, no notes: "${text}"`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            translatedOutput.innerText = result;
            statusText.innerText = "EN LÍNEA";
            statusText.className = "text-green-500";
            textBuffer = ""; // Limpiar buffer tras éxito
        } else if (data.error) {
            statusText.innerText = "CUOTA EXCEDIDA (ESPERE)";
            statusText.className = "text-red-500";
        }
    } catch (e) {
        statusText.innerText = "ERROR CONEXIÓN";
        statusText.className = "text-red-500";
    }
}

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        alert("Chrome es necesario para esta función.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    
    // Ajustar idioma según selector
    const mode = document.getElementById('languageMode').value;
    recognition.lang = mode === "es-EN" ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        // ACTUALIZACIÓN INSTANTÁNEA DEL TEXTO GRIS
        const currentListening = interim || final;
        if (currentListening) {
            liveOriginal.innerText = currentListening;
        }

        if (final) {
            textBuffer += " " + final;
            // Si hay suficiente texto acumulado, intentar traducir
            if (textBuffer.split(' ').length > 5) {
                callGemini(textBuffer);
            }
        }
    };

    recognition.onerror = (event) => {
        console.error("Speech Error:", event.error);
        statusText.innerText = "REINICIANDO MICRO...";
    };

    recognition.onend = () => {
        if (isRecording) recognition.start();
    };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR";
        document.getElementById('btnStart').className = "btn bg-green-600 text-white";
        statusText.innerText = "PAUSADO";
    } else {
        if (!recognition) initSpeech();
        try {
            recognition.start();
            isRecording = true;
            document.getElementById('btnStart').innerText = "DETENER";
            document.getElementById('btnStart').className = "btn bg-red-600 text-white animate-pulse";
            statusText.innerText = "ESCUCHANDO";
            liveOriginal.innerText = "Esperando voz...";
        } catch(e) {
            console.error(e);
        }
    }
};
</script>
</body>
</html>
