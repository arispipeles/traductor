<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Pro Iglesia</title>
    <style>
        body { margin: 0; background-color: black; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #config-panel { background: #1a1a1a; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 2px solid #333; }
        input, select, button { padding: 8px; border-radius: 5px; border: none; }
        button { cursor: pointer; font-weight: bold; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        
        #status-bar { position: fixed; top: 15px; right: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: gray; }
        
        #display-area { height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; box-sizing: border-box; text-align: center; }
        #interim-text { color: #888; font-size: 24px; margin-bottom: 30px; min-height: 1.2em; max-width: 80%; }
        #translated-text { color: #FFD700; font-weight: bold; line-height: 1.2; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        .slider-container { display: flex; align-items: center; gap: 10px; color: white; font-size: 12px; }
    </style>
</head>
<body>

<div id="config-panel">
    <input type="password" id="api-key" placeholder="Pega tu API Key de Google" style="width: 200px;">
    <select id="translation-direction">
        <option value="Español a Inglés">Español ➔ Inglés</option>
        <option value="Inglés a Español">Inglés ➔ Español</option>
    </select>
    <div class="slider-container">
        TAMAÑO: <input type="range" id="font-size" min="40" max="150" value="80">
    </div>
    <button id="btn-toggle" class="btn-start">INICIAR MICRO</button>
</div>

<div id="status-bar">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">LISTO</span>
</div>

<div id="display-area">
    <div id="interim-text">Esperando voz...</div>
    <div id="translated-text">...</div>
</div>

<script>
    let recognition;
    let isRecording = false;
    let accumulatedText = "";
    let lastTranslationTime = 0;
    const MIN_WORDS = 6; // Espera a tener al menos 6 palabras para traducir

    const interimDisplay = document.getElementById('interim-text');
    const translatedDisplay = document.getElementById('translated-text');
    const btnToggle = document.getElementById('btn-toggle');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const fontSizeSlider = document.getElementById('font-size');

    // Actualizar tamaño de letra en tiempo real
    fontSizeSlider.oninput = () => {
        translatedDisplay.style.fontSize = fontSizeSlider.value + 'px';
    };
    translatedDisplay.style.fontSize = '80px';

    if (!('webkitSpeechRecognition' in window)) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Chrome.");
    } else {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isRecording = true;
            btnToggle.textContent = "DETENER";
            btnToggle.className = "btn-stop";
            statusDot.style.background = "#28a745";
            statusText.textContent = "ESCUCHANDO";
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    accumulatedText += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            interimDisplay.textContent = interimTranscript || accumulatedText;

            // Lógica de traducción inteligente
            const wordCount = (accumulatedText + interimTranscript).trim().split(/\s+/).length;
            const now = Date.now();

            if (wordCount >= MIN_WORDS && (now - lastTranslationTime) > 4000) {
                const textToTranslate = (accumulatedText + interimTranscript).trim();
                translateText(textToTranslate);
                accumulatedText = ""; // Limpiar para la siguiente frase
                lastTranslationTime = now;
            }
        };

        recognition.onerror = (event) => {
            console.error("Error de voz:", event.error);
            statusDot.style.background = "orange";
            statusText.textContent = "REINTENTANDO...";
            if (isRecording) recognition.start();
        };

        recognition.onend = () => {
            if (isRecording) recognition.start(); // Reinicio automático si se corta
        };
    }

    async function translateText(text) {
        const apiKey = document.getElementById('api-key').value;
        const direction = document.getElementById('translation-direction').value;
        
        if (!apiKey) {
            statusText.textContent = "FALTA API KEY";
            statusDot.style.background = "red";
            return;
        }

        statusDot.style.background = "#007bff";
        statusText.textContent = "TRADUCIENDO...";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const prompt = `Actúa como un traductor simultáneo de una iglesia. Traduce el siguiente texto de ${direction} de forma natural y solemne. Solo entrega el texto traducido: "${text}"`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                translatedDisplay.textContent = data.candidates[0].content.parts[0].text;
                statusDot.style.background = "#28a745";
                statusText.textContent = "ESCUCHANDO";
            } else {
                throw new Error("Respuesta vacía");
            }
        } catch (error) {
            console.error("Error API:", error);
            statusDot.style.background = "red";
            statusText.textContent = "ERROR API";
        }
    }

    btnToggle.onclick = () => {
        if (isRecording) {
            recognition.stop();
            isRecording = false;
            btnToggle.textContent = "INICIAR MICRO";
            btnToggle.className = "btn-start";
            statusDot.style.background = "gray";
            statusText.textContent = "PAUSADO";
        } else {
            recognition.start();
        }
    };
</script>

</body>
</html>
