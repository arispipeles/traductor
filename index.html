<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Church Translator - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; 
            overflow: hidden; 
            height: 100vh; 
            margin: 0; 
        }
        .text-huge { 
            font-size: 14vw; 
            line-height: 1.1; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center;
            word-wrap: break-word;
            padding: 0 5%;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.8);
        }
        .cursor-blink { 
            animation: blink 1s infinite; 
            border-left: 15px solid #fbbf24; 
            margin-left: 10px; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #controls { 
            opacity: 0; 
            transition: opacity 0.3s; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(15, 15, 15, 0.98); 
            padding: 20px; 
            z-index: 100; 
            display: flex; 
            flex-wrap: wrap;
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 2px solid #fbbf24; 
        }
        #controls:hover { opacity: 1; }
        
        .error-log {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #450a0a;
            color: #fca5a5;
            padding: 15px 30px;
            border-radius: 20px;
            display: none;
            font-size: 16px;
            z-index: 200;
            text-align: center;
            max-width: 90%;
            border: 2px solid #ef4444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="controls">
    <div class="flex flex-col gap-1">
        <label class="text-[10px] text-gray-400 uppercase font-bold">1. Tu Google API Key (Segura)</label>
        <input type="password" id="apiKeyInput" placeholder="Pega aquí tu clave AIza..." class="bg-gray-900 text-yellow-500 px-4 py-2 rounded-lg border border-gray-700 w-64 focus:border-yellow-500 outline-none">
    </div>
    
    <div class="flex flex-col gap-1">
        <label class="text-[10px] text-gray-400 uppercase font-bold">2. Idioma</label>
        <select id="langMode" class="bg-gray-800 text-white px-4 py-2 rounded-lg border border-gray-600 outline-none">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <button id="btnStart" class="bg-green-600 hover:bg-green-500 px-10 py-3 mt-4 rounded-full font-bold text-white transition-all transform active:scale-95 shadow-lg">INICIAR MICRÓFONO</button>
    
    <div class="flex items-center gap-3 ml-4 mt-4">
        <span class="text-xs text-gray-400">Tamaño:</span>
        <input type="range" id="sizeSlider" min="5" max="30" value="14" class="w-32 accent-yellow-500">
    </div>
</div>

<div class="flex flex-col justify-center items-center h-screen">
    <div id="original" class="text-white opacity-30 text-3xl italic mb-8 h-10 text-center px-10"></div>
    <div id="translated" class="text-huge">
        SISTEMA LISTO
        <span class="cursor-blink"></span>
    </div>
</div>

<div id="errorBox" class="error-log"></div>

<script>
const btnStart = document.getElementById('btnStart');
const translated = document.getElementById('translated');
const original = document.getElementById('original');
const errorBox = document.getElementById('errorBox');
const sizeSlider = document.getElementById('sizeSlider');
const apiKeyInput = document.getElementById('apiKeyInput');

let recognition;
let isRecording = false;

// Cargar la clave si ya se guardó antes en este Mac
if(localStorage.getItem('church_api_key')) {
    apiKeyInput.value = localStorage.getItem('church_api_key');
}

function showError(msg) {
    console.error(msg);
    errorBox.innerHTML = `<strong>Aviso de Google:</strong> ${msg}`;
    errorBox.style.display = 'block';
}

async function translateText(text) {
    if (text.trim().length < 2) return;
    
    const key = apiKeyInput.value.trim();
    if (!key) {
        showError("Por favor, pega tu API Key en la parte superior (pasa el mouse arriba).");
        return;
    }
    
    // Guardar clave localmente para la próxima vez (No en GitHub)
    localStorage.setItem('church_api_key', key);

    const isEsToEn = document.getElementById('langMode').value === 'es-EN';
    const source = isEsToEn ? "Spanish" : "English";
    const target = isEsToEn ? "English" : "Spanish";

    // Intentamos PRIMERO con la versión ESTABLE v1 (Sin Beta)
    const attempts = [
        { ver: "v1", mod: "gemini-1.5-flash" }, // La más rápida y económica
        { ver: "v1", mod: "gemini-1.5-pro" },   // La más potente
        { ver: "v1beta", mod: "gemini-1.5-flash" } // Último recurso
    ];

    for (let attempt of attempts) {
        const url = `https://generativelanguage.googleapis.com/${attempt.ver}/models/${attempt.mod}:generateContent?key=${key}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Translate this sermon precisely from ${source} to ${target}. Religious tone. ONLY output the translation: "${text}"`
                        }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const result = data.candidates[0].content.parts[0].text;
                translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
                errorBox.style.display = 'none'; 
                return; // Éxito: salimos del bucle
            } else if (data.error) {
                console.warn(`Intento fallido con ${attempt.mod}: ${data.error.message}`);
                // Solo mostramos el error si es el último intento
                if (attempt === attempts[attempts.length - 1]) {
                    showError(data.error.message);
                }
            }
        } catch (e) {
            console.warn("Error de conexión, probando siguiente modelo...");
        }
    }
}

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        showError("Usa Google Chrome. El sistema de voz no es compatible con este navegador.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => {
        if (e.error === 'not-allowed') showError("¡Activa el micrófono en el candado arriba a la izquierda de la dirección URL!");
    };
}

btnStart.onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.lang = document.getElementById('langMode').value === 'es-EN' ? 'es-ES' : 'en-US';
        try {
            recognition.start();
            isRecording = true;
            btnStart.innerText = "DETENER";
            btnStart.classList.replace('bg-green-600', 'bg-red-600');
        } catch (err) {}
    } else {
        recognition.stop();
        isRecording = false;
        btnStart.innerText = "INICIAR MICRÓFONO";
        btnStart.classList.replace('bg-red-600', 'bg-green-600');
    }
};

sizeSlider.oninput = (e) => {
    translated.style.fontSize = `${e.target.value}vw`;
};
</script>

</body>
</html>
