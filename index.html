<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor IA Iglesia - Versión Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; overflow: hidden; height: 100vh; margin: 0; }
        .text-huge { font-size: clamp(2rem, 13vw, 22rem); line-height: 1.1; font-weight: 900; text-transform: uppercase; text-shadow: 4px 4px 0px rgba(0,0,0,1); }
        .text-sub { font-size: clamp(1rem, 3vw, 4rem); color: #ffffff; opacity: 0.5; font-weight: 600; margin-bottom: 1rem; }
        .cursor-blink { animation: blink 1s infinite; border-left: 10px solid #fbbf24; margin-left: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #controls { transition: opacity 0.3s ease; opacity: 0; }
        #controls:hover { opacity: 1; }
        .scroll-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 5%; text-align: center; }
    </style>
</head>
<body>

<div id="controls" class="fixed top-0 left-0 w-full p-4 bg-gray-900/90 backdrop-blur-md z-50 flex items-center justify-between border-b border-yellow-600/20">
    <div class="flex items-center gap-4">
        <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-full font-bold transition-all flex items-center gap-2">
            <span id="statusIcon" class="w-3 h-3 bg-white rounded-full"></span>
            <span id="btnLabel">INICIAR SERMÓN</span>
        </button>
        
        <select id="langMode" class="bg-gray-800 text-white px-3 py-2 rounded-lg border border-gray-700 outline-none">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>

        <div class="flex flex-col ml-4">
            <label class="text-[10px] uppercase text-gray-400">Tamaño</label>
            <input type="range" id="fontSizeSlider" min="5" max="25" value="13" class="w-32 accent-yellow-500">
        </div>
    </div>

    <div class="flex items-center gap-4">
        <input type="password" id="apiKeyInput" value="AIzaSyCw6f5TKALD5fEA60yQ_kNOhzqWA1BC06Y" class="bg-black text-[10px] text-yellow-500/50 px-2 py-1 rounded border border-gray-800 w-40">
        <button id="btnFullscreen" class="text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </button>
    </div>
</div>

<div class="scroll-container">
    <div id="outputContainer" class="w-full">
        <div id="originalText" class="text-sub italic">Esperando voz del pastor...</div>
        <div id="translatedText" class="text-huge">BIENVENIDOS<span id="cursor" class="cursor-blink"></span></div>
    </div>
</div>

<div id="notification" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl hidden z-50 shadow-2xl">
    <p id="notifMessage"></p>
</div>

<script>
let recognition;
let isRecording = false;
let currentInputLang = 'es-ES';
const apiKeyInput = document.getElementById('apiKeyInput');
const originalText = document.getElementById('originalText');
const translatedText = document.getElementById('translatedText');

async function translateWithAI(text) {
    const activeKey = apiKeyInput.value.trim();
    if (!activeKey || text.length < 2) return;
    
    // Probamos diferentes rutas que Google suele usar
    const endpoints = [
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${activeKey}`,
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${activeKey}`,
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${activeKey}`
    ];

    const prompt = `Translate the following church sermon text from ${currentInputLang === 'es-ES' ? 'Spanish to English' : 'English to Spanish'}. Maintain a respectful religious tone. Only return the translated text. TEXT: "${text}"`;

    let success = false;

    for (let url of endpoints) {
        if (success) break;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const result = await response.json();
            
            if (result.candidates && result.candidates[0]) {
                const translated = result.candidates[0].content.parts[0].text;
                translatedText.innerHTML = `${translated}<span class="cursor-blink"></span>`;
                originalText.style.opacity = "0.3";
                success = true;
            }
        } catch (e) {
            console.error("Error en este endpoint, probando el siguiente...");
        }
    }

    if (!success) {
        showNotification("Google no responde. Verifica tu API Key o conexión.");
    }
}

function setupRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        showNotification("Navegador no compatible. Usa Chrome.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = currentInputLang;

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        if (final) {
            originalText.innerText = final;
            translateWithAI(final);
        } else {
            originalText.innerText = interim;
            originalText.style.opacity = "1";
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

const btnStart = document.getElementById('btnStart');
const btnLabel = document.getElementById('btnLabel');
const statusIcon = document.getElementById('statusIcon');
const langMode = document.getElementById('langMode');
const fontSizeSlider = document.getElementById('fontSizeSlider');

btnStart.onclick = () => {
    if (!recognition) setupRecognition();
    if (!isRecording) {
        recognition.lang = currentInputLang;
        recognition.start();
        isRecording = true;
        btnStart.classList.replace('bg-green-600', 'bg-red-600');
        statusIcon.classList.add('animate-ping');
        btnLabel.innerText = "DETENER";
    } else {
        recognition.stop();
        isRecording = false;
        btnStart.classList.replace('bg-red-600', 'bg-green-600');
        statusIcon.classList.remove('animate-ping');
        btnLabel.innerText = "INICIAR";
    }
};

langMode.onchange = (e) => {
    currentInputLang = (e.target.value === 'es-EN') ? 'es-ES' : 'en-US';
    if (isRecording) {
        recognition.stop();
        setTimeout(() => { recognition.start(); }, 500);
    }
};

fontSizeSlider.oninput = (e) => {
    translatedText.style.fontSize = `${e.target.value}vw`;
};

document.getElementById('btnFullscreen').onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
};

function showNotification(msg) {
    const notif = document.getElementById('notification');
    document.getElementById('notifMessage').innerText = msg;
    notif.classList.remove('hidden');
    setTimeout(() => notif.classList.add('hidden'), 5000);
}

translatedText.style.fontSize = `${fontSizeSlider.value}vw`;
</script>
</body>
</html>
