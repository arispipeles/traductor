DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 70vh;
            padding: 0 5%;
            text-align: center;
            gap: 1.5rem;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            width: 100%;
        }

        .line-0 { opacity: 1; transform: scale(1); color: #fbbf24; text-shadow: 0 0 30px rgba(251, 191, 36, 0.4); }
        .line-1 { opacity: 0.6; transform: scale(0.9); color: #f59e0b; }
        .line-2 { opacity: 0.3; transform: scale(0.85); color: #d97706; }
        .line-3 { opacity: 0.15; transform: scale(0.8); color: #b45309; }

        #admin-panel { 
            background: #111; 
            border-bottom: 2px solid #333; 
            padding: 12px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
            font-size: 13px;
        }
        
        .hidden-panel { transform: translateY(-100%); position: absolute; width: 100%; transition: 0.3s; }
        .live-preview { color: #555; font-style: italic; height: 50px; font-size: 1.8rem; text-align: center; margin-top: 20px; text-transform: lowercase; }
        
        select, input, button { border-radius: 8px; padding: 6px 12px; }
        .btn-active { background: #b91c1c !important; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="Pega tu API Key..." class="bg-black text-yellow-500 border border-gray-700 w-48 outline-none">
    
    <button onclick="discoverModels()" class="bg-blue-700 hover:bg-blue-600 text-white font-bold transition-all">
        1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white border border-gray-700 w-40 outline-none"></select>

    <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded-lg border border-gray-700">
        <label class="text-gray-400 font-bold text-[10px]">IDIOMA:</label>
        <select id="languageMode" class="bg-transparent text-white outline-none font-bold">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <div class="flex items-center gap-2">
        <label class="text-gray-400 font-bold">TAMAÑO:</label>
        <input type="range" id="sizeSlider" min="3" max="14" value="8" step="0.5" class="w-32">
    </div>

    <button id="btnStart" class="bg-green-700 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold transition-all">
        2. INICIAR MICRO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-white border border-gray-600">OCULTAR</button>
    <span id="log" class="text-[10px] text-gray-400"></span>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <div id="live-original" class="live-preview">Esperando voz del sermón...</div>
    
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">...</div>
        <div id="line-1" class="translation-line line-1"></div>
        <div id="line-2" class="translation-line line-2"></div>
        <div id="line-3" class="translation-line line-3"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const languageMode = document.getElementById('languageMode');
const log = document.getElementById('log');
const sizeSlider = document.getElementById('sizeSlider');
const liveOriginal = document.getElementById('live-original');

let translationHistory = ["", "", "", ""];
let lastTranslation = "";
let lastProcessedText = ""; // Evita traducir lo mismo dos veces
let isProcessing = false;

// Cargar llave previa
if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

// Control de tamaño
sizeSlider.oninput = () => {
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = sizeSlider.value + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { log.innerText = "Error: Pega la llave"; return; }
    localStorage.setItem('church_key', key);
    log.innerText = "Buscando modelos...";
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${key}`);
        const data = await response.json();
        if (data.models) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
                if (m.supportedGenerationMethods.includes('generateContent')) {
                    const name = m.name.replace('models/', '');
                    const opt = new Option(name, name);
                    if (name.includes('flash')) opt.selected = true;
                    modelSelect.add(opt);
                }
            });
            log.innerText = "Modelos cargados.";
        } else { log.innerText = "Error: Llave no válida."; }
    } catch (e) { log.innerText = "Error de conexión."; }
}

async function translateChunk(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value;
    const mode = languageMode.value;
    
    // Si el texto es igual al anterior o muy corto, ignoramos
    if (!key || !model || text === lastProcessedText || text.trim().split(' ').length < 3) return;
    
    isProcessing = true;
    lastProcessedText = text;

    const sourceLang = mode === "es-EN" ? "Spanish" : "English";
    const targetLang = mode === "es-EN" ? "English" : "Spanish";

    // Prompt optimizado para sermones (Streaming Context)
    const prompt = `Context: Church sermon translation. 
    Task: Translate from ${sourceLang} to ${targetLang}. 
    Rules: Natural, sacred, and fluid tone. 
    IMPORTANT: ONLY return the translation. No explanations.
    Text to translate: "${text}"`;

    try {
        const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            if (result !== lastTranslation) {
                updateDisplay(result);
                lastTranslation = result;
            }
        }
    } catch (e) { console.error("Error IA"); }
    finally { isProcessing = false; }
}

function updateDisplay(newText) {
    translationHistory.unshift(newText);
    if(translationHistory.length > 4) translationHistory.pop();
    
    for(let i = 0; i < 4; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    
    const mode = languageMode.value;
    recognition.lang = (mode === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        
        liveOriginal.innerText = interim || final;

        // Lógica de "Streaming": si hay una pausa larga o el texto interino es largo
        if (final) {
            translateChunk(final);
        } else if (interim.split(' ').length > 10) { 
            // Si la oración es larga, traducimos el "trozo" para no esperar al punto final
            translateChunk(interim);
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "2. INICIAR MICRO";
        document.getElementById('btnStart').classList.remove('btn-active');
    } else {
        initRecognition();
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER MICRO";
        document.getElementById('btnStart').classList.add('btn-active');
        log.innerText = "Escuchando...";
    }
};

languageMode.onchange = () => {
    if (isRecording) { recognition.stop(); setTimeout(() => document.getElementById('btnStart').click(), 400); }
};

// Ajuste inicial
sizeSlider.oninput();
</script>
</body>
</html>
