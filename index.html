<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia - Buscador Automático</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        .text-huge { font-size: 12vw; line-height: 1.1; font-weight: 900; text-transform: uppercase; text-align: center; width: 100%; padding: 0 5%; text-shadow: 0 0 40px rgba(251, 191, 36, 0.3); }
        .cursor-blink { animation: blink 1s infinite; border-left: 15px solid #fbbf24; margin-left: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #admin-panel { background: #1a1a1a; border-bottom: 2px solid #333; padding: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; position: relative; z-index: 1000; transition: all 0.3s; }
        #admin-panel.hidden-panel { transform: translateY(-100%); position: absolute; }
        .error-log { background: #450a0a; color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 14px; margin-top: 10px; width: 100%; text-align: center; display: none; border: 1px solid #f87171; }
        .success-log { background: #064e3b; color: #a7f3d0; padding: 10px; border-radius: 8px; font-size: 14px; margin-top: 10px; width: 100%; text-align: center; display: none; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold uppercase">1. Tu Nueva API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Pega tu clave nueva aquí..." class="bg-black text-yellow-500 px-3 py-2 rounded border border-gray-700 w-64 outline-none focus:border-yellow-500">
    </div>

    <button onclick="discoverModels()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold transition-all shadow-lg active:scale-95">
        🔎 BUSCAR MODELOS
    </button>

    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold uppercase">2. Modelo:</label>
        <select id="modelSelect" class="bg-black text-white px-3 py-2 rounded border border-gray-700 w-48 outline-none">
            <option value="">Esperando búsqueda...</option>
        </select>
    </div>

    <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-full font-bold transition-all shadow-lg ml-4">INICIAR MICRÓFONO</button>
    
    <button onclick="togglePanel()" class="bg-gray-700 text-white px-3 py-1 rounded text-xs">OCULTAR MENÚ</button>

    <div id="statusBox" class="error-log"></div>
    <div id="successBox" class="success-log"></div>
</div>

<div class="flex flex-col justify-center items-center" style="height: calc(100vh - 50px);" onclick="togglePanel()">
    <div id="original" class="text-white opacity-30 text-2xl italic mb-6 h-10 px-10 text-center">Configura la llave nueva y busca modelos...</div>
    <div id="translated" class="text-huge">LISTO<span class="cursor-blink"></span></div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const statusBox = document.getElementById('statusBox');
const successBox = document.getElementById('successBox');
const translated = document.getElementById('translated');
const original = document.getElementById('original');

// Recuperar llave guardada en este navegador
if(localStorage.getItem('church_key_v2')) {
    apiKeyInput.value = localStorage.getItem('church_key_v2');
}

function togglePanel() {
    document.getElementById('admin-panel').classList.toggle('hidden-panel');
}

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) {
        showError("Pega la llave nueva que sacaste de AI Studio.");
        return;
    }
    
    localStorage.setItem('church_key_v2', key);
    showError(null);
    showSuccess("Conectando con Google...");

    try {
        const url = `https://generativelanguage.googleapis.com/v1/models?key=${key}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
            showError("Google dice: " + data.error.message);
            return;
        }

        if (data.models) {
            modelSelect.innerHTML = '';
            // Buscamos modelos compatibles con traducción
            const validModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
            
            validModels.forEach(m => {
                const name = m.name.replace('models/', '');
                const option = document.createElement('option');
                option.value = name;
                option.text = name;
                modelSelect.appendChild(option);
            });

            showSuccess(`¡Llave válida! Encontrados ${validModels.length} modelos. Dale a INICIAR.`);
            original.innerText = "Haga clic en Iniciar y hable.";
        }
    } catch (e) {
        showError("Error de conexión. Revisa el internet.");
    }
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value;
    if (!key || !model || text.trim().length < 2) return;

    const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${key}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Translate to English (Solemn church context): ${text}` }] }]
            })
        });

        const data = await response.json();
        if (data.candidates) {
            const result = data.candidates[0].content.parts[0].text;
            translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
        }
    } catch (e) {}
}

let recognition;
let isRecording = false;

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        showError("Por favor usa Chrome.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-ES';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };
    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.replace('bg-green-600', 'bg-red-600');
        showSuccess("Escuchando...");
    } else {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR MICRÓFONO";
        document.getElementById('btnStart').classList.replace('bg-red-600', 'bg-green-600');
    }
};

function showError(msg) {
    statusBox.innerText = msg;
    statusBox.style.display = msg ? 'block' : 'none';
    if(msg) successBox.style.display = 'none';
}

function showSuccess(msg) {
    successBox.innerText = msg;
    successBox.style.display = msg ? 'block' : 'none';
    if(msg) statusBox.style.display = 'none';
}
</script>
</body>
</html>
