<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Church Translator - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fbbf24; /* Amarillo vibrante para máxima visibilidad */
            overflow: hidden;
            height: 100vh;
        }
        .text-huge {
            font-size: clamp(2rem, 15vw, 25rem);
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px rgba(0,0,0,1), 0 0 20px rgba(251, 191, 36, 0.3);
        }
        .text-sub {
            font-size: clamp(1rem, 4vw, 6rem);
            color: #ffffff;
            opacity: 0.6;
            font-weight: 700;
        }
        .cursor-blink {
            animation: blink 1s infinite;
            border-left: 12px solid #fbbf24;
            margin-left: 10px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #controls {
            transition: transform 0.3s ease;
            transform: translateY(-90%);
        }
        #controls:hover { transform: translateY(0); }
        
        .scroll-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 5%;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="controls" class="fixed top-0 left-0 w-full p-4 bg-gray-900/95 backdrop-blur-lg z-50 flex items-center justify-between border-b border-yellow-600/30">
    <div class="flex items-center gap-4">
        <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-full font-bold transition-all transform hover:scale-105 flex items-center gap-2 shadow-lg shadow-green-900/20">
            <span id="statusIcon" class="w-4 h-4 bg-white rounded-full"></span>
            <span id="btnLabel">INICIAR SERMÓN</span>
        </button>
        
        <select id="langMode" class="bg-gray-800 text-white px-4 py-3 rounded-xl border border-gray-700 outline-none focus:ring-2 ring-yellow-500">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>

        <div class="flex flex-col ml-4">
            <label class="text-[10px] uppercase tracking-widest text-gray-400 mb-1">Tamaño del Texto</label>
            <input type="range" id="fontSizeSlider" min="5" max="22" value="13" class="w-48 accent-yellow-500">
        </div>
    </div>

    <div class="flex items-center gap-6">
        <div class="hidden md:flex flex-col items-end">
            <span class="text-[10px] text-gray-500 uppercase">Gemini AI Key</span>
            <input type="password" id="apiKeyInput" value="AIzaSyCw6f5TKALD5fEA60yQ_kNOhzqWA1BC06Y" class="bg-gray-950 text-[10px] text-yellow-500/50 px-2 py-1 rounded border border-gray-800 w-32 focus:border-yellow-500 outline-none">
        </div>
        <button id="btnFullscreen" class="bg-gray-800 p-3 rounded-full hover:bg-gray-700 text-gray-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </button>
    </div>
</div>

<div class="scroll-container">
    <div id="outputContainer" class="max-w-full flex flex-col gap-4">
        <div id="originalText" class="text-sub italic transition-all duration-500">
            Esperando voz del pastor...
        </div>
        <div id="translatedText" class="text-huge">
            WELCOME
            <span id="cursor" class="cursor-blink"></span>
        </div>
    </div>
</div>

<div id="notification" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-yellow-600 text-black px-8 py-4 rounded-2xl shadow-2xl hidden z-50 font-bold border-2 border-black animate-bounce">
    <p id="notifMessage"></p>
</div>

<script>
let recognition;
let isRecording = false;
let currentLang = 'es-ES';
const apiKeyInput = document.getElementById('apiKeyInput');
const originalText = document.getElementById('originalText');
const translatedText = document.getElementById('translatedText');

async function translateWithAI(text) {
    const activeKey = apiKeyInput.value.trim();
    if (!activeKey || text.trim().length < 2) return;
    
    originalText.classList.add('opacity-40');

    // Prompt optimizado para la iglesia
    const prompt = `Translate the following text from ${currentLang === 'es-ES' ? 'Spanish to English' : 'English to Spanish'}. 
    CONTEXT: This is a church sermon. Ensure the translation is natural, respectful, and maintains the religious context. 
    TEXT: "${text}" 
    Only provide the translated text.`;

    try {
        // CORRECCIÓN: Usando el endpoint v1 (más estable) y el nombre de modelo directo
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${activeKey}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const result = await response.json();
        
        if (result.error) {
            throw new Error(result.error.message);
        }
        
        const translated = result.candidates?.[0]?.content?.parts?.[0]?.text || "Error en traducción";
        
        translatedText.innerHTML = `${translated}<span class="cursor-blink"></span>`;
        originalText.classList.remove('opacity-40');
    } catch (error) {
        console.error("AI Error:", error);
        showNotification("⚠️ Error: " + error.message);
    }
}

function setupRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!window.SpeechRecognition) {
        showNotification("Usa Chrome en tu Mac para esta aplicación.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = currentLang;

    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }

        if (finalTranscript) {
            originalText.innerText = finalTranscript;
            translateWithAI(finalTranscript);
        } else {
            originalText.innerText = interimTranscript;
        }
    };

    recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
            showNotification("❌ Permiso denegado. Haz clic en el candado junto a la URL y activa el Micrófono.");
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

const btnStart = document.getElementById('btnStart');
const btnLabel = document.getElementById('btnLabel');
const statusIcon = document.getElementById('statusIcon');
const langMode = document.getElementById('langMode');
const fontSizeSlider = document.getElementById('fontSizeSlider');

btnStart.onclick = () => {
    if (!recognition) setupRecognition();

    if (!isRecording) {
        try {
            recognition.lang = currentLang;
            recognition.start();
            isRecording = true;
            btnStart.classList.replace('bg-green-600', 'bg-red-600');
            statusIcon.classList.add('animate-ping');
            btnLabel.innerText = "DETENER";
        } catch (e) {
            console.error(e);
        }
    } else {
        recognition.stop();
        isRecording = false;
        btnStart.classList.replace('bg-red-600', 'bg-green-600');
        statusIcon.classList.remove('animate-ping');
        btnLabel.innerText = "INICIAR SERMÓN";
    }
};

langMode.onchange = (e) => {
    const val = e.target.value;
    currentLang = (val === 'es-EN') ? 'es-ES' : 'en-US';
    if (isRecording) { recognition.stop(); }
};

fontSizeSlider.oninput = (e) => {
    translatedText.style.fontSize = `${e.target.value}vw`;
};

document.getElementById('btnFullscreen').onclick = () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
};

function showNotification(msg) {
    const notif = document.getElementById('notification');
    document.getElementById('notifMessage').innerText = msg;
    notif.classList.remove('hidden');
    setTimeout(() => notif.classList.add('hidden'), 6000);
}

// Escala inicial
translatedText.style.fontSize = `${fontSizeSlider.value}vw`;
</script>

</body>
</html>
