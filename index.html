<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia - Panel de Control Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        .text-huge { font-size: 12vw; line-height: 1.1; font-weight: 900; text-transform: uppercase; text-align: center; width: 100%; padding: 0 5%; text-shadow: 0 0 40px rgba(251, 191, 36, 0.3); }
        .cursor-blink { animation: blink 1s infinite; border-left: 15px solid #fbbf24; margin-left: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* Panel superior siempre visible para configurar */
        #admin-panel { background: #1a1a1a; border-bottom: 2px solid #333; padding: 15px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; position: relative; z-index: 1000; }
        .model-btn { background: #333; color: white; padding: 8px 15px; rounded: 8px; font-size: 12px; border: 1px solid #444; transition: all 0.2s; }
        .model-btn.active { background: #fbbf24; color: black; font-weight: bold; border-color: #fff; }
        .error-log { background: #450a0a; color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 10px; width: 100%; text-align: center; display: none; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold uppercase">1. Tu API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Pega tu clave AIza..." class="bg-black text-yellow-500 px-3 py-2 rounded border border-gray-700 w-64 outline-none focus:border-yellow-500">
    </div>

    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold uppercase">2. Selecciona Modelo:</label>
        <div class="flex gap-2">
            <button onclick="setModel('gemini-1.5-flash', this)" class="model-btn active">Flash 1.5</button>
            <button onclick="setModel('gemini-1.5-flash-latest', this)" class="model-btn">Flash Latest</button>
            <button onclick="setModel('gemini-1.5-pro', this)" class="model-btn">Pro 1.5</button>
            <button onclick="setModel('gemini-pro', this)" class="model-btn">Pro 1.0</button>
        </div>
    </div>

    <div class="flex items-center gap-4 ml-4">
        <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-full font-bold transition-all active:scale-95 shadow-lg shadow-green-900/40">INICIAR MICRÓFONO</button>
        <div class="flex flex-col">
            <label class="text-[10px] text-gray-400 font-bold uppercase">Tamaño:</label>
            <input type="range" id="sizeSlider" min="5" max="20" value="12" class="w-24 accent-yellow-500">
        </div>
    </div>

    <div id="errorBox" class="error-log"></div>
</div>

<div class="flex flex-col justify-center items-center" style="height: calc(100vh - 100px);">
    <div id="original" class="text-white opacity-30 text-2xl italic mb-6 h-10 px-10 text-center">Esperando voz...</div>
    <div id="translated" class="text-huge">HOLA<span class="cursor-blink"></span></div>
</div>

<script>
let selectedModel = 'gemini-1.5-flash';
const apiKeyInput = document.getElementById('apiKeyInput');
const translated = document.getElementById('translated');
const original = document.getElementById('original');
const errorBox = document.getElementById('errorBox');
const sizeSlider = document.getElementById('sizeSlider');

// Cargar llave guardada
if(localStorage.getItem('church_key')) {
    apiKeyInput.value = localStorage.getItem('church_key');
}

function setModel(name, btn) {
    selectedModel = name;
    // Estética de los botones
    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    console.log("Cambiado a:", selectedModel);
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    if (!key || text.trim().length < 2) return;
    
    localStorage.setItem('church_key', key);
    errorBox.style.display = 'none';

    // Usamos la ruta ESTABLE (v1)
    const url = `https://generativelanguage.googleapis.com/v1/models/${selectedModel}:generateContent?key=${key}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Translate to English (Church context, direct translation): ${text}` }] }]
            })
        });

        const data = await response.json();
        
        if (data.error) {
            errorBox.innerText = `Error con ${selectedModel}: ${data.error.message}`;
            errorBox.style.display = 'block';
        } else if (data.candidates && data.candidates[0].content) {
            const result = data.candidates[0].content.parts[0].text;
            translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
        }
    } catch (e) {
        errorBox.innerText = "Error de red. Revisa tu conexión.";
        errorBox.style.display = 'block';
    }
}

let recognition;
let isRecording = false;

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        alert("Usa Google Chrome en tu Mac.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-ES';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.replace('bg-green-600', 'bg-red-600');
    } else {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR MICRÓFONO";
        document.getElementById('btnStart').classList.replace('bg-red-600', 'bg-green-600');
    }
};

sizeSlider.oninput = (e) => {
    translated.style.fontSize = `${e.target.value}vw`;
};
</script>
</body>
</html>
