<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Estable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 85vh;
            padding: 0 5%;
            text-align: center;
            gap: 1.5rem;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            word-wrap: break-word;
        }

        .line-0 { opacity: 1; color: #fbbf24; text-shadow: 0 0 50px rgba(251, 191, 36, 0.6); transform: scale(1); }
        .line-1 { opacity: 0.5; color: #f59e0b; transform: scale(0.9); }
        .line-2 { opacity: 0.25; color: #d97706; transform: scale(0.8); }
        .line-3 { opacity: 0.1; color: #b45309; transform: scale(0.7); }

        #admin-panel { 
            background: rgba(15, 15, 15, 0.98); 
            border-bottom: 2px solid #333; 
            padding: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
            transition: transform 0.4s ease;
        }
        
        .hidden-panel { transform: translateY(-100%); position: absolute; width: 100%; }
        .live-preview { color: #444; font-style: italic; height: 25px; font-size: 1rem; text-align: center; margin-top: 5px; opacity: 0.8; }
        
        select, input, button { border-radius: 10px; padding: 6px 12px; border: 1px solid #333; font-size: 0.9rem; font-weight: bold; }
        .btn-active { background: #b91c1c !important; border-color: #ef4444; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #888; background: #111; padding: 4px 12px; border-radius: 15px; border: 1px solid #222; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .dot-green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-blue { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .dot-red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="API Key de Google..." class="bg-black text-yellow-500 w-40 outline-none border-yellow-900/30">
    
    <button onclick="discoverModels()" class="bg-blue-800 hover:bg-blue-700 text-white transition-all">
        1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white w-48 outline-none border-gray-800">
        <option value="gemini-1.5-flash">gemini-1.5-flash (Recomendado)</option>
    </select>

    <select id="languageMode" class="bg-gray-900 text-white outline-none border-gray-800">
        <option value="es-EN">ESP ➔ ENG</option>
        <option value="en-ES">ENG ➔ ESP</option>
    </select>

    <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded-xl">
        <span class="text-gray-600 text-[10px]">TAMAÑO:</span>
        <input type="range" id="sizeSlider" min="5" max="25" value="13" step="0.5" class="w-24 accent-yellow-500">
    </div>

    <button id="btnStart" class="bg-green-700 hover:bg-green-600 text-white px-4 rounded-full transition-all">
        2. INICIAR
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-gray-400 hover:text-white px-3">OCULTAR</button>
    
    <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="log">Listo</span>
    </div>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <div id="live-original" class="live-preview">...</div>
    
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">LISTO PARA TRADUCIR</div>
        <div id="line-1" class="translation-line line-1">READY TO TRANSLATE</div>
        <div id="line-2" class="translation-line line-2"></div>
        <div id="line-3" class="translation-line line-3"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const languageMode = document.getElementById('languageMode');
const log = document.getElementById('log');
const statusDot = document.getElementById('statusDot');
const sizeSlider = document.getElementById('sizeSlider');
const liveOriginal = document.getElementById('live-original');

let translationHistory = ["", "", "", ""];
let isProcessing = false;
let lastRequestTime = 0;
const MIN_REQUEST_INTERVAL = 5000; // 5 segundos para máxima seguridad con cuenta gratuita
let textBuffer = "";

if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

sizeSlider.oninput = () => {
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = sizeSlider.value + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { updateStatus("Pega tu llave primero", "red"); return; }
    localStorage.setItem('church_key', key);
    updateStatus("Buscando...", "blue");
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await response.json();
        if (data.models) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
                if (m.supportedGenerationMethods.includes('generateContent')) {
                    // Guardamos solo el ID limpio (ej: gemini-1.5-flash)
                    const cleanName = m.name.split('/').pop();
                    const opt = new Option(cleanName, cleanName);
                    if (cleanName === "gemini-1.5-flash") opt.selected = true;
                    modelSelect.add(opt);
                }
            });
            updateStatus("Modelos listos", "green");
        } else {
            updateStatus("Error de llave", "red");
        }
    } catch (e) { updateStatus("Sin conexión", "red"); }
}

function updateStatus(msg, color) {
    log.innerText = msg;
    statusDot.className = `dot dot-${color}`;
}

async function translateWithIA(text) {
    const key = apiKeyInput.value.trim();
    // Aseguramos que el nombre esté limpio de prefijos 'models/'
    let modelName = (modelSelect.value || "gemini-1.5-flash").split('/').pop();
    const mode = languageMode.value;
    const now = Date.now();

    if (!key || isProcessing || text.trim().length < 8) return;

    // Control de cuota para evitar el "Exceeded Quota"
    if (now - lastRequestTime < MIN_REQUEST_INTERVAL) {
        console.log("Esperando ventana de tiempo...");
        return;
    }

    isProcessing = true;
    updateStatus("Traduciendo...", "blue");

    const target = mode === "es-EN" ? "English" : "Spanish";
    const prompt = `Direct translation to ${target} (church context). No talk, just text: "${text}"`;

    try {
        // URL corregida: el nombre del modelo va después de /models/ SIN repeticiones
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            updateDisplay(result);
            updateStatus("En línea", "green");
            textBuffer = ""; 
            lastRequestTime = Date.now(); // Solo actualizamos el tiempo si fue exitoso
        } else if (data.error) {
            updateStatus(data.error.message.substring(0, 30), "red");
            console.error("Error Google:", data.error);
        }
    } catch (e) {
        updateStatus("Error de red", "red");
    } finally {
        isProcessing = false;
    }
}

function updateDisplay(newText) {
    if (!newText || newText === translationHistory[0]) return;
    translationHistory.unshift(newText);
    if(translationHistory.length > 4) translationHistory.pop();
    for(let i = 0; i < 4; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        updateStatus("Chrome requerido", "red");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = (languageMode.value === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        
        liveOriginal.innerText = interim || final;

        if (final) {
            textBuffer += " " + final;
            // Solo envía si hay una frase con peso (evita gastar cuota en "Amén" o silencios)
            if (textBuffer.split(' ').length >= 5) {
                translateWithIA(textBuffer);
            }
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "2. INICIAR";
        document.getElementById('btnStart').classList.remove('btn-active');
        updateStatus("Apagado", "red");
    } else {
        initRecognition();
        try {
            recognition.start();
            isRecording = true;
            document.getElementById('btnStart').innerText = "DETENER";
            document.getElementById('btnStart').classList.add('btn-active');
            updateStatus("Escuchando...", "green");
        } catch(e) { updateStatus("Error Micro", "red"); }
    }
};

languageMode.onchange = () => {
    if (isRecording) { recognition.stop(); setTimeout(() => document.getElementById('btnStart').click(), 400); }
};

sizeSlider.oninput();
</script>
</body>
</html>
