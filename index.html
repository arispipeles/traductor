<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Modo Subtítulos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        /* Contenedor de subtítulos */
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            padding: 0 5%;
            text-align: center;
            gap: 1rem;
        }

        .translation-line {
            line-height: 1.2;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.5s ease;
            width: 100%;
        }

        /* La línea más nueva es la más brillante, las viejas se opacan un poco */
        .line-0 { opacity: 1; transform: scale(1); }
        .line-1 { opacity: 0.7; transform: scale(0.95); }
        .line-2 { opacity: 0.4; transform: scale(0.9); }
        .line-3 { opacity: 0.2; transform: scale(0.85); }

        #admin-panel { 
            background: #1a1a1a; 
            border-bottom: 2px solid #333; 
            padding: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
        }
        
        .hidden-panel { display: none !important; }
        
        .status-msg { padding: 5px 15px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .error { background: #450a0a; color: #fca5a5; }
        .success { background: #064e3b; color: #a7f3d0; }
        
        input[type=range] { cursor: pointer; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="flex flex-col gap-1">
        <label class="text-[10px] text-gray-400 uppercase font-bold">1. API Key Nueva</label>
        <input type="password" id="apiKeyInput" placeholder="Pega tu API Key aquí..." class="bg-black text-yellow-500 px-3 py-2 rounded border border-gray-700 w-48 outline-none">
    </div>
    
    <button onclick="discoverModels()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-bold transition-all mt-4">
        🔎 BUSCAR MODELOS
    </button>

    <div class="flex flex-col gap-1">
        <label class="text-[10px] text-gray-400 uppercase font-bold">2. Modelo</label>
        <select id="modelSelect" class="bg-black text-white px-3 py-2 rounded border border-gray-700 w-40 outline-none">
            <option value="">Esperando...</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[10px] text-yellow-500 uppercase font-bold">3. Tamaño de Letra</label>
        <input type="range" id="sizeSlider" min="3" max="12" value="6" step="0.5" class="w-40">
    </div>

    <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-6 py-4 rounded-full font-bold transition-all mt-2 shadow-lg shadow-green-900/40">
        4. INICIAR MICRÓFONO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-700 text-white px-3 py-2 rounded mt-2">OCULTAR</button>
    
    <div id="log" class="status-msg"></div>
</div>

<div class="h-full flex flex-col" onclick="togglePanel()">
    <div id="original" class="text-white opacity-20 text-center text-lg italic py-4 h-12">...</div>
    <div id="subtitle-container">
        <!-- Aquí aparecerán las 4 líneas -->
        <div id="line-0" class="translation-line line-0">LISTO</div>
        <div id="line-1" class="translation-line line-1"></div>
        <div id="line-2" class="translation-line line-2"></div>
        <div id="line-3" class="translation-line line-3"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const log = document.getElementById('log');
const sizeSlider = document.getElementById('sizeSlider');
const original = document.getElementById('original');

// Memoria de las últimas 4 traducciones
let translationHistory = ["LISTO", "", "", ""];

// Recuperar llave anterior
if(localStorage.getItem('church_key_vfinal')) {
    apiKeyInput.value = localStorage.getItem('church_key_vfinal');
}

function togglePanel() {
    document.getElementById('admin-panel').classList.toggle('hidden-panel');
}

function showLog(msg, type) {
    log.innerText = msg;
    log.className = `status-msg ${type}`;
}

// Actualizar tamaño de letra en tiempo real
sizeSlider.oninput = () => {
    const size = sizeSlider.value;
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = size + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { showLog("Pega la llave", "error"); return; }
    localStorage.setItem('church_key_vfinal', key);
    showLog("Buscando...", "success");

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${key}`);
        const data = await response.json();
        if (data.error) { showLog("Error: " + data.error.message, "error"); return; }

        modelSelect.innerHTML = '';
        const validModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
        validModels.forEach(m => {
            const name = m.name.replace('models/', '');
            const option = document.createElement('option');
            option.value = name;
            option.text = name;
            if(name.includes('flash')) option.selected = true;
            modelSelect.appendChild(option);
        });
        showLog("¡Listo! Inicia micro", "success");
    } catch (e) { showLog("Error de conexión", "error"); }
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value;
    if (!key || !model || text.trim().length < 2) return;

    // ORDEN ULTRA ESTRICTA: Solo traducción directa
    const prompt = `Translate to English for a church sermon context. ONLY return the translation. No explanations, no alternatives. Text: "${text}"`;

    try {
        const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates) {
            let result = data.candidates[0].content.parts[0].text.replace(/"/g, '').trim();
            updateSubtitles(result);
        }
    } catch (e) { console.error(e); }
}

function updateSubtitles(newText) {
    // Desplazar historial (la nueva entra en la posición 0)
    translationHistory.unshift(newText);
    if(translationHistory.length > 4) translationHistory.pop();

    // Actualizar los contenedores en pantalla
    for(let i = 0; i < 4; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-ES';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };
    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.replace('bg-green-600', 'bg-red-600');
        showLog("Escuchando...", "success");
    } else {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR MICRÓFONO";
        document.getElementById('btnStart').classList.replace('bg-red-600', 'bg-green-600');
    }
};

// Aplicar tamaño inicial
sizeSlider.oninput();
</script>
</body>
</html>
