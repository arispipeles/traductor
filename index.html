<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        #config { background: #222; padding: 15px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #444; }
        #status-bar { position: fixed; top: 15px; right: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: gray; }
        #display { height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #interim { color: #666; font-size: 24px; margin-bottom: 20px; font-style: italic; }
        #translated { color: #FFD700; font-weight: bold; line-height: 1.2; }
        input, select, button { padding: 8px; border-radius: 4px; border: none; }
        button { cursor: pointer; background: #28a745; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="config">
    <input type="password" id="key" placeholder="API Key de Google" style="width: 250px;">
    <select id="lang">
        <option value="es-EN">Español a Inglés</option>
        <option value="en-ES">Inglés a Español</option>
    </select>
    <div style="font-size: 12px;">LETRA: <input type="range" id="size" min="40" max="150" value="80"></div>
    <button id="btn">INICIAR</button>
</div>

<div id="status-bar">
    <div id="dot" class="dot"></div>
    <span id="st-text">LISTO</span>
</div>

<div id="display">
    <div id="interim">Esperando voz...</div>
    <div id="translated">...</div>
</div>

<script>
    let rec;
    let active = false;
    let buffer = "";
    let lastT = 0;

    const interimDiv = document.getElementById('interim');
    const transDiv = document.getElementById('translated');
    const btn = document.getElementById('btn');
    const dot = document.getElementById('dot');
    const stText = document.getElementById('st-text');
    const size = document.getElementById('size');

    size.oninput = () => transDiv.style.fontSize = size.value + 'px';
    transDiv.style.fontSize = '80px';

    if (!('webkitSpeechRecognition' in window)) {
        alert("Usa Chrome");
    } else {
        rec = new webkitSpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'es-US';

        rec.onstart = () => {
            active = true;
            btn.textContent = "DETENER";
            btn.style.background = "#dc3545";
            dot.style.background = "#28a745";
            stText.textContent = "CONECTADO";
        };

        rec.onresult = (e) => {
            let temp = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) buffer += e.results[i][0].transcript + ' ';
                else temp += e.results[i][0].transcript;
            }
            interimDiv.textContent = temp || buffer;

            const words = (buffer + temp).trim().split(/\s+/).length;
            const now = Date.now();

            // Enviamos a traducir si hay más de 5 palabras y pasaron 4.5 segundos
            if (words >= 5 && (now - lastT) > 4500) {
                callAI((buffer + temp).trim());
                buffer = "";
                lastT = now;
            }
        };

        rec.onend = () => { if (active) rec.start(); };
    }

    async function callAI(txt) {
        const k = document.getElementById('key').value.trim();
        if (!k) { stText.textContent = "FALTA CLAVE"; return; }

        stText.textContent = "TRADUCIENDO...";
        dot.style.background = "#007bff";

        // CONFIGURACIÓN ACTUALIZADA A 2026: Usamos gemini-2.0-flash en el endpoint v1
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${k}`;

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Traduce a ${document.getElementById('lang').value === 'es-EN' ? 'inglés' : 'español'} de forma solemne y fluida para la pantalla de una iglesia, entrega SOLO el texto traducido sin añadir introducciones ni comillas adicionales: "${txt}"` }] }]
                })
            });

            const d = await res.json();
            
            if (res.ok && d.candidates && d.candidates[0].content.parts[0].text) {
                transDiv.textContent = d.candidates[0].content.parts[0].text;
                dot.style.background = "#28a745";
                stText.textContent = "CONECTADO";
            } else {
                const errMsg = d.error ? d.error.message : "Error de respuesta";
                throw new Error(errMsg);
            }
        } catch (err) {
            console.error(err);
            stText.textContent = err.message.substring(0, 30);
            dot.style.background = "red";
        }
    }

    btn.onclick = () => {
        if (active) { active = false; rec.stop(); btn.textContent = "INICIAR"; btn.style.background = "#28a745"; }
        else { rec.start(); }
    };
</script>
</body>
</html>
