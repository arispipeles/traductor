<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Motor Groq</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        #config { background: #222; padding: 15px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #444; }
        #status-bar { position: fixed; top: 15px; right: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: gray; }
        #display { height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #interim { color: #666; font-size: 24px; margin-bottom: 20px; font-style: italic; }
        #translated { color: #FFD700; font-weight: bold; line-height: 1.2; }
        input, select, button { padding: 8px; border-radius: 4px; border: none; }
        button { cursor: pointer; background: #28a745; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="config">
    <input type="password" id="key" placeholder="Pega tu API Key de GROQ (gsk_...)" style="width: 280px;">
    <select id="lang">
        <option value="es-EN">Español a Inglés</option>
        <option value="en-ES">Inglés a Español</option>
    </select>
    <div style="font-size: 12px;">LETRA: <input type="range" id="size" min="40" max="150" value="80"></div>
    <button id="btn">INICIAR</button>
</div>

<div id="status-bar">
    <div id="dot" class="dot"></div>
    <span id="st-text">LISTO</span>
</div>

<div id="display">
    <div id="interim">Esperando voz...</div>
    <div id="translated">...</div>
</div>

<script>
    let rec;
    let active = false;
    let textBuffer = ""; 
    let timerInterval = null;

    const interimDiv = document.getElementById('interim');
    const transDiv = document.getElementById('translated');
    const btn = document.getElementById('btn');
    const dot = document.getElementById('dot');
    const stText = document.getElementById('st-text');
    const size = document.getElementById('size');

    size.oninput = () => transDiv.style.fontSize = size.value + 'px';
    transDiv.style.fontSize = '80px';

    function initRecognition() {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Por favor, usa Google Chrome.");
            return;
        }

        rec = new webkitSpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        
        // Configuración dinámica estricta de idioma
        const selection = document.getElementById('lang').value;
        if (selection === "en-ES") {
            rec.lang = 'en-US'; // Inglés de Estados Unidos
        } else {
            rec.lang = 'es-US'; // Español
        }

        rec.onstart = () => {
            active = true;
            btn.textContent = "DETENER";
            btn.style.background = "#dc3545";
            dot.style.background = "#28a745";
            stText.textContent = "CONECTADO (" + rec.lang.toUpperCase() + ")";
            startTranslationTimer();
        };

        rec.onresult = (e) => {
            let liveText = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) {
                    textBuffer += e.results[i][0].transcript + ' ';
                } else {
                    liveText += e.results[i][0].transcript;
                }
            }
            interimDiv.textContent = liveText || textBuffer || "Escuchando...";
        };

        rec.onend = () => { 
            if (active) {
                try { rec.start(); } catch(err) {}
            } 
        };
    }

    // Forzar reinicio completo del micrófono si el usuario cambia el idioma en el selector
    document.getElementById('lang').onchange = () => {
        if (active) {
            rec.stop();
            setTimeout(() => { initRecognition(); rec.start(); }, 400);
        }
    };

    function startTranslationTimer() {
        if(timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            const cleanText = textBuffer.trim();
            if (cleanText.split(/\s+/).length >= 3) {
                callGroqAI(cleanText);
                textBuffer = ""; 
            }
        }, 6000); 
    }

    async function callGroqAI(txt) {
        const k = document.getElementById('key').value.trim();
        if (!k) { stText.textContent = "FALTA CLAVE"; return; }

        stText.textContent = "TRADUCIENDO...";
        dot.style.background = "#007bff";

        const url = "https://api.groq.com/openai/v1/chat/completions";
        const currentLang = document.getElementById('lang').value;
        const promptTarget = currentLang === 'es-EN' ? 'Español a Inglés' : 'Inglés a Español';

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${k}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [{
                        role: "user",
                        content: `Eres un traductor simultáneo en una iglesia cristiana. Traduce de forma natural, fluida, contextual y solemne de ${promptTarget}. Corrige cualquier pequeño error gramatical o palabra mal entendida por el micrófono para que la traducción tenga sentido bíblico y eclesiástico. Entrega exclusivamente el texto traducido directo, sin comentarios ni comillas extras: "${txt}"`
                    }],
                    temperature: 0.2
                })
            });

            const d = await res.json();
            
            if (res.ok && d.choices && d.choices[0].message.content) {
                transDiv.textContent = d.choices[0].message.content.trim();
                dot.style.background = "#28a745";
                stText.textContent = "CONECTADO (" + rec.lang.toUpperCase() + ")";
            } else {
                const errMsg = d.error ? d.error.message : "Error de respuesta";
                throw new Error(errMsg);
            }
        } catch (err) {
            console.error(err);
            stText.textContent = err.message.substring(0, 30).toUpperCase();
            dot.style.background = "red";
        }
    }

    btn.onclick = () => {
        if (active) { 
            active = false; 
            rec.stop(); 
            clearInterval(timerInterval);
            btn.textContent = "INICIAR"; 
            btn.style.background = "#28a745"; 
            dot.style.background = "gray";
            stText.textContent = "LISTO";
        } else { 
            initRecognition();
            rec.start(); 
        }
    };
</script>
</body>
</html>
