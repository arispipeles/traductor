<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Ultra Estable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            padding: 0 5%;
            text-align: center;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.5s ease;
            width: 100%;
        }

        .line-0 { font-size: 13vw; color: #fbbf24; text-shadow: 0 0 30px rgba(251, 191, 36, 0.4); }
        .line-1 { font-size: 6vw; opacity: 0.4; color: #f59e0b; margin-top: 20px; }

        #admin-panel { 
            background: rgba(20, 20, 20, 0.95); 
            border-bottom: 2px solid #333; 
            padding: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
        }
        
        .hidden-panel { display: none !important; }

        .live-preview { 
            color: #666; 
            font-size: 1.5rem; 
            text-align: center; 
            margin-top: 20px;
            height: 40px;
            font-weight: 400;
        }

        /* Indicador de actividad del micro */
        #mic-activity {
            width: 100px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            margin: 5px auto;
        }
        #mic-bar {
            width: 0%;
            height: 100%;
            background: #22c55e;
            transition: width 0.1s;
        }
        
        button { border-radius: 8px; padding: 8px 16px; font-weight: bold; transition: all 0.2s; }
        .btn-active { background: #dc2626 !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="API Key de Google" class="bg-black text-yellow-500 px-3 py-2 border border-gray-800 w-64 outline-none">
    
    <button onclick="checkKey()" class="bg-blue-700 text-white hover:bg-blue-600">VERIFICAR LLAVE</button>

    <select id="modelSelect" class="bg-gray-900 text-white p-2 border border-gray-700 outline-none">
        <option value="gemini-1.5-flash">gemini-1.5-flash (Gratis)</option>
        <option value="gemini-1.5-pro">gemini-1.5-pro (Mejor)</option>
    </select>

    <select id="languageMode" class="bg-gray-900 text-white p-2 border border-gray-700 outline-none">
        <option value="es-EN">ESP ➔ ENG</option>
        <option value="en-ES">ENG ➔ ESP</option>
    </select>

    <button id="btnStart" class="bg-green-700 text-white hover:bg-green-600">INICIAR</button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-gray-400">OCULTAR</button>

    <div class="text-[10px] text-gray-500 ml-4">
        ESTADO: <span id="statusText" class="text-gray-300">Listo</span>
    </div>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <div class="mt-10">
        <div id="mic-activity"><div id="mic-bar"></div></div>
        <div id="live-original" class="live-preview">Haz clic en INICIAR para comenzar</div>
    </div>
    
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">ESPERANDO</div>
        <div id="line-1" class="translation-line line-1">La traducción aparecerá aquí</div>
    </div>
</div>

<script>
let recognition;
let isRecording = false;
let lastTranslationTime = 0;
let textToTranslate = "";
const MIN_DELAY = 5000; // 5 segundos entre traducciones para evitar bloqueos de Google

const apiKeyInput = document.getElementById('apiKeyInput');
const liveOriginal = document.getElementById('live-original');
const line0 = document.getElementById('line-0');
const line1 = document.getElementById('line-1');
const statusText = document.getElementById('statusText');
const micBar = document.getElementById('mic-bar');

// Cargar llave guardada
if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

function checkKey() {
    const key = apiKeyInput.value.trim();
    if(key) {
        localStorage.setItem('church_key', key);
        statusText.innerText = "Llave guardada";
        statusText.style.color = "#22c55e";
    }
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    const now = Date.now();
    const model = document.getElementById('modelSelect').value;
    const mode = document.getElementById('languageMode').value;

    if (!key || text.trim().length < 10) return;
    if (now - lastTranslationTime < MIN_DELAY) return;

    lastTranslationTime = now;
    statusText.innerText = "Traduciendo...";

    const target = mode === "es-EN" ? "English" : "Spanish";
    const prompt = `Translate to ${target} (church sermon context). ONLY THE TRANSLATION, NO EXPLANATIONS: "${text}"`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            // Desplazar texto
            line1.innerText = line0.innerText;
            line0.innerText = result;
            statusText.innerText = "En línea";
            textToTranslate = ""; // Limpiar buffer después de traducir
        } else if (data.error) {
            statusText.innerText = "Error: " + data.error.message.split(' ').slice(0,3).join(' ');
        }
    } catch (e) {
        statusText.innerText = "Error de conexión";
    }
}

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        alert("Tu navegador no soporta voz. Usa Chrome.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = (document.getElementById('languageMode').value === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        // MOSTRAR LO QUE ESCUCHA (Gris)
        const currentText = interim || final;
        if(currentText) {
            liveOriginal.innerText = currentText;
            micBar.style.width = "100%"; // Simulamos actividad visual
            setTimeout(() => micBar.style.width = "30%", 100);
        }

        if (final) {
            textToTranslate += " " + final;
            // Si el buffer es lo suficientemente largo, intentar traducir
            if (textToTranslate.split(' ').length > 6) {
                translateText(textToTranslate);
            }
        }
    };

    recognition.onerror = (event) => {
        console.error("Error Micro:", event.error);
        statusText.innerText = "Error Micro: " + event.error;
        if(event.error === 'not-allowed') alert("¡Permiso de micrófono denegado! Haz clic en el candado de la barra de direcciones.");
    };

    recognition.onend = () => {
        if (isRecording) recognition.start();
    };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR";
        document.getElementById('btnStart').classList.remove('btn-active');
        statusText.innerText = "Pausado";
    } else {
        if (!recognition) initSpeech();
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.add('btn-active');
        statusText.innerText = "Escuchando...";
        liveOriginal.innerText = "Hable ahora...";
    }
};
</script>
</body>
</html>
