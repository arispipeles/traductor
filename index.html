<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Versión Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        /* Ajuste de texto para que no se corte y sea gigante */
        .text-huge { 
            font-size: 10vw; 
            line-height: 1; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center; 
            width: 100%; 
            padding: 0 5%;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        .cursor-blink { animation: blink 1s infinite; border-left: 10px solid #fbbf24; margin-left: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #admin-panel { background: #1a1a1a; border-bottom: 2px solid #333; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; position: relative; z-index: 1000; }
        .hidden-panel { display: none !important; }
        
        .status-msg { padding: 5px 15px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .error { background: #450a0a; color: #fca5a5; }
        .success { background: #064e3b; color: #a7f3d0; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="Pega tu Nueva API Key aquí..." class="bg-black text-yellow-500 px-3 py-2 rounded border border-gray-700 w-64 outline-none">
    
    <button onclick="discoverModels()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-bold transition-all">
        🔎 1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white px-3 py-2 rounded border border-gray-700 w-48 outline-none">
        <option value="">Esperando búsqueda...</option>
    </select>

    <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-full font-bold transition-all">
        2. INICIAR MICRÓFONO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-700 text-white px-3 py-2 rounded">OCULTAR</button>
    
    <div id="log" class="status-msg"></div>
</div>

<div class="flex flex-col justify-center items-center h-full" onclick="togglePanel()">
    <div id="original" class="text-white opacity-20 text-xl italic mb-4 h-8">...</div>
    <div id="translated" class="text-huge">LISTO<span class="cursor-blink"></span></div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const log = document.getElementById('log');
const translated = document.getElementById('translated');
const original = document.getElementById('original');

// Recuperar llave anterior si existe
if(localStorage.getItem('church_key_vfinal')) {
    apiKeyInput.value = localStorage.getItem('church_key_vfinal');
}

function togglePanel() {
    document.getElementById('admin-panel').classList.toggle('hidden-panel');
}

function showLog(msg, type) {
    log.innerText = msg;
    log.className = `status-msg ${type}`;
}

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { showLog("Pega la llave primero", "error"); return; }
    
    localStorage.setItem('church_key_vfinal', key);
    showLog("Buscando modelos...", "success");

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${key}`);
        const data = await response.json();

        if (data.error) {
            showLog("Error: " + data.error.message, "error");
            return;
        }

        modelSelect.innerHTML = '';
        const validModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
        validModels.forEach(m => {
            const name = m.name.replace('models/', '');
            const option = document.createElement('option');
            option.value = name;
            option.text = name;
            if(name.includes('flash')) option.selected = true;
            modelSelect.appendChild(option);
        });

        showLog("¡Listo! Dale a INICIAR", "success");
    } catch (e) {
        showLog("Error de conexión", "error");
    }
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value;
    if (!key || !model || text.trim().length < 2) return;

    // ORDEN ESTRICTA: Solo traducción, sin explicaciones.
    const prompt = `Translate exactly this to English for a church context. Output ONLY the translation, no extra words: "${text}"`;

    try {
        const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();
        if (data.candidates) {
            let result = data.candidates[0].content.parts[0].text;
            // Limpiar posibles comillas de la IA
            result = result.replace(/"/g, '').trim();
            translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
        }
    } catch (e) { console.error(e); }
}

let recognition;
let isRecording = false;

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-ES';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };
    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.replace('bg-green-600', 'bg-red-600');
        showLog("Escuchando...", "success");
    } else {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "INICIAR MICRÓFONO";
        document.getElementById('btnStart').classList.replace('bg-red-600', 'bg-green-600');
    }
};
</script>
</body>
</html>
