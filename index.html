<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Multi-Idioma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            padding: 0 5%;
            text-align: center;
            gap: 1rem;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s ease-out;
            width: 100%;
        }

        /* Efecto de profundidad para las líneas anteriores */
        .line-0 { opacity: 1; transform: scale(1); color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        .line-1 { opacity: 0.6; transform: scale(0.9); color: #f59e0b; }
        .line-2 { opacity: 0.3; transform: scale(0.8); color: #d97706; }

        #admin-panel { 
            background: #111; 
            border-bottom: 2px solid #333; 
            padding: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
            font-size: 13px;
        }
        
        .hidden-panel { display: none !important; }
        .live-preview { color: #666; font-style: italic; height: 40px; font-size: 1.5rem; text-align: center; margin-top: 20px; }
        
        select, input, button {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="Pega tu API Key..." class="bg-black text-yellow-500 px-3 py-1 border border-gray-700 w-48 outline-none">
    
    <button onclick="discoverModels()" class="bg-blue-700 hover:bg-blue-600 text-white px-4 py-1 font-bold transition-all">
        1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white px-3 py-1 border border-gray-700 w-48 outline-none"></select>

    <!-- Selector de Dirección de Traducción -->
    <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded-lg border border-gray-700">
        <label class="text-gray-400 font-bold text-[10px]">DIRECCIÓN:</label>
        <select id="languageMode" class="bg-transparent text-white outline-none font-bold">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <div class="flex items-center gap-2">
        <label class="text-gray-400 font-bold">TAMAÑO:</label>
        <input type="range" id="sizeSlider" min="4" max="15" value="8" step="0.5" class="w-32">
    </div>

    <button id="btnStart" class="bg-green-700 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold transition-all">
        2. INICIAR MICRO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-white px-3 py-1 border border-gray-600">OCULTAR</button>
    <span id="log" class="text-[10px] text-gray-500"></span>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <div id="live-original" class="live-preview">Esperando voz...</div>
    
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">LISTO</div>
        <div id="line-1" class="translation-line line-1"></div>
        <div id="line-2" class="translation-line line-2"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const languageMode = document.getElementById('languageMode');
const log = document.getElementById('log');
const sizeSlider = document.getElementById('sizeSlider');
const liveOriginal = document.getElementById('live-original');

let translationHistory = ["LISTO PARA EL SERMÓN", "", ""];
let lastTranslatedText = "";

// Cargar llave previa si existe para ahorrar tiempo
if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

// Control de tamaño dinámico
sizeSlider.oninput = () => {
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = sizeSlider.value + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) {
        log.innerText = "Error: Pega la llave primero";
        return;
    }
    
    localStorage.setItem('church_key', key);
    log.innerText = "Buscando...";
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${key}`);
        const data = await response.json();
        
        if (data.error) {
            log.innerText = "Error: " + data.error.message;
            return;
        }

        if (data.models) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
                // Solo mostrar modelos que sirvan para generar contenido
                if (m.supportedGenerationMethods.includes('generateContent')) {
                    const name = m.name.replace('models/', '');
                    const opt = new Option(name, name);
                    // Priorizamos Gemini 2.0 Flash o 1.5 Flash por velocidad
                    if (name.includes('2.0-flash') || name.includes('1.5-flash')) opt.selected = true;
                    modelSelect.add(opt);
                }
            });
            log.innerText = "Modelos listos. Seleccionado: " + modelSelect.value;
        }
    } catch (e) {
        log.innerText = "Error de conexión";
    }
}

async function translateChunk(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value;
    const mode = languageMode.value; // es-EN o en-ES
    
    if (!key || !model || text === lastTranslatedText) return;
    
    lastTranslatedText = text;
    
    // Instrucción estricta para evitar que la IA "hable" de más
    let promptInstruction = (mode === "es-EN") 
        ? "Translate from Spanish to English for a church sermon. ONLY output the translation. No notes, no explanations. Text:" 
        : "Traduce de Inglés a Español para un sermón de iglesia. SOLO entrega la traducción. Sin notas, sin explicaciones. Texto:";

    const prompt = `${promptInstruction} "${text}"`;

    try {
        const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();
        const result = data.candidates[0].content.parts[0].text.trim();
        updateDisplay(result);
    } catch (e) {
        console.error("Error IA");
    }
}

function updateDisplay(newText) {
    translationHistory.unshift(newText);
    if(translationHistory.length > 3) translationHistory.pop();
    
    for(let i = 0; i < 3; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    
    // Cambiamos el idioma del micro según el selector
    const mode = languageMode.value;
    recognition.lang = (mode === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        
        liveOriginal.innerText = interim || final;

        if (final) {
            translateChunk(final);
        } else if (interim.split(' ').length > 8) { 
            // Si la frase es larga, traducimos un trozo antes de que termine
            translateChunk(interim);
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "2. INICIAR MICRO";
        document.getElementById('btnStart').classList.replace('bg-red-700', 'bg-green-700');
    } else {
        initRecognition(); // Reiniciamos para aplicar cambios de idioma si los hubo
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "DETENER";
        document.getElementById('btnStart').classList.replace('bg-green-700', 'bg-red-700');
    }
};

// Si cambian el idioma mientras está encendido, reiniciamos para aplicar el cambio de micro
languageMode.onchange = () => {
    if (isRecording) {
        recognition.stop();
        setTimeout(() => document.getElementById('btnStart').click(), 400);
    }
};

// Ajuste inicial de tamaño
sizeSlider.oninput();
</script>
</body>
</html>
