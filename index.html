<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia - Versión Estable v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; overflow: hidden; height: 100vh; margin: 0; }
        .text-huge { font-size: 15vw; line-height: 1.1; font-weight: 900; text-transform: uppercase; text-align: center; width: 100%; padding: 0 5%; text-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
        .cursor-blink { animation: blink 1s infinite; border-left: 15px solid #fbbf24; margin-left: 10px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #controls { position: fixed; top: 0; width: 100%; background: #111; padding: 15px; z-index: 100; transform: translateY(-100%); transition: transform 0.3s; display: flex; gap: 20px; align-items: center; justify-content: center; border-bottom: 2px solid #fbbf24; }
        body:hover #controls { transform: translateY(0); }
        .error-log { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #7f1d1d; color: #fca5a5; padding: 10px 20px; border-radius: 10px; display: none; z-index: 200; font-size: 14px; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div id="controls">
    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold uppercase">Pega tu API Key aquí:</label>
        <input type="password" id="apiKeyInput" placeholder="AIza..." class="bg-black text-yellow-500 px-4 py-2 rounded border border-gray-700 w-64 outline-none focus:border-yellow-500">
    </div>
    
    <select id="langMode" class="bg-gray-800 text-white px-4 py-2 rounded border border-gray-600 outline-none">
        <option value="es-EN">Español ➔ Inglés</option>
        <option value="en-ES">Inglés ➔ Español</option>
    </select>

    <button id="btnStart" class="bg-green-600 hover:bg-green-500 text-white px-8 py-2 rounded-full font-bold transition-all active:scale-95">INICIAR MICRÓFONO</button>
    
    <div class="flex flex-col">
        <label class="text-[10px] text-gray-400 font-bold">TAMAÑO:</label>
        <input type="range" id="sizeSlider" min="5" max="25" value="15" class="w-32 accent-yellow-500">
    </div>
</div>

<div class="flex flex-col justify-center items-center h-screen">
    <div id="original" class="text-white opacity-20 text-2xl italic mb-4 h-8"></div>
    <div id="translated" class="text-huge">LISTO<span class="cursor-blink"></span></div>
</div>

<div id="errorBox" class="error-log"></div>

<script>
const btnStart = document.getElementById('btnStart');
const translated = document.getElementById('translated');
const original = document.getElementById('original');
const errorBox = document.getElementById('errorBox');
const sizeSlider = document.getElementById('sizeSlider');
const apiKeyInput = document.getElementById('apiKeyInput');

// Recuperar llave si ya se usó
if(localStorage.getItem('church_key')) {
    apiKeyInput.value = localStorage.getItem('church_key');
}

function showError(msg) {
    errorBox.innerText = `Google dice: ${msg}`;
    errorBox.style.display = 'block';
}

async function translateText(text) {
    const key = apiKeyInput.value.trim();
    if (!key || text.trim().length < 2) return;
    
    localStorage.setItem('church_key', key); // Guardar para la próxima vez

    const isEsToEn = document.getElementById('langMode').value === 'es-EN';
    const source = isEsToEn ? "Spanish" : "English";
    const target = isEsToEn ? "English" : "Spanish";

    // URL PURA v1 (Sin rastro de beta)
    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: `Translate this sermon precisely from ${source} to ${target}. Religious tone. ONLY output the translation: "${text}"`
                    }]
                }]
            })
        });

        const data = await response.json();
        
        if (data.error) {
            showError(data.error.message);
        } else if (data.candidates && data.candidates[0].content) {
            const result = data.candidates[0].content.parts[0].text;
            translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
            errorBox.style.display = 'none';
        }
    } catch (e) {
        showError("Error de conexión. Revisa tu internet.");
    }
}

let recognition;
let isRecording = false;

function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        showError("Chrome es obligatorio para esta app.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => { if (e.error === 'not-allowed') showError("¡Activa el micrófono en el candado de la URL!"); };
}

btnStart.onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.lang = document.getElementById('langMode').value === 'es-EN' ? 'es-ES' : 'en-US';
        recognition.start();
        isRecording = true;
        btnStart.innerText = "DETENER";
        btnStart.classList.replace('bg-green-600', 'bg-red-600');
    } else {
        recognition.stop();
        isRecording = false;
        btnStart.innerText = "INICIAR MICRÓFONO";
        btnStart.classList.replace('bg-red-600', 'bg-green-600');
    }
};

sizeSlider.oninput = (e) => {
    translated.style.fontSize = `${e.target.value}vw`;
};
</script>
</body>
</html>
