<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
        }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 75vh;
            padding: 0 5%;
            text-align: center;
            gap: 1rem;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: 100%;
        }

        /* Efecto de profundidad para los subtítulos */
        .line-0 { opacity: 1; color: #fbbf24; text-shadow: 0 0 30px rgba(251, 191, 36, 0.4); }
        .line-1 { opacity: 0.6; transform: scale(0.95); color: #f59e0b; }
        .line-2 { opacity: 0.3; transform: scale(0.9); color: #d97706; }
        .line-3 { opacity: 0.15; transform: scale(0.85); color: #b45309; }

        #admin-panel { 
            background: #111; 
            border-bottom: 2px solid #333; 
            padding: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
            font-size: 12px;
        }
        
        .hidden-panel { transform: translateY(-100%); position: absolute; width: 100%; transition: 0.3s; }
        .live-preview { color: #666; font-style: italic; height: 40px; font-size: 1.5rem; text-align: center; margin-top: 15px; text-transform: lowercase; }
        
        select, input, button { border-radius: 8px; padding: 6px 12px; border: 1px solid #333; }
        .btn-active { background: #b91c1c !important; border-color: #ef4444; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="Pega tu API Key..." class="bg-black text-yellow-500 w-48 outline-none">
    
    <button onclick="discoverModels()" class="bg-blue-700 hover:bg-blue-600 text-white font-bold transition-all">
        1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white w-40 outline-none">
        <option value="gemini-1.5-flash">Predeterminado (Flash)</option>
    </select>

    <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded-lg">
        <label class="text-gray-400 font-bold text-[10px]">DIRECCIÓN:</label>
        <select id="languageMode" class="bg-transparent text-white outline-none font-bold">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <div class="flex items-center gap-2">
        <label class="text-gray-400 font-bold text-[10px]">TAMAÑO:</label>
        <input type="range" id="sizeSlider" min="3" max="18" value="9" step="0.5" class="w-24">
    </div>

    <button id="btnStart" class="bg-green-700 hover:bg-green-600 text-white px-5 py-2 rounded-full font-bold transition-all">
        2. INICIAR MICRO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-white border-gray-600">OCULTAR</button>
    <div class="flex items-center text-[10px] text-gray-400 ml-2">
        <span id="statusDot" class="status-dot bg-gray-600"></span>
        <span id="log">Listo</span>
    </div>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <div id="live-original" class="live-preview">Esperando voz...</div>
    
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">...</div>
        <div id="line-1" class="translation-line line-1"></div>
        <div id="line-2" class="translation-line line-2"></div>
        <div id="line-3" class="translation-line line-3"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const languageMode = document.getElementById('languageMode');
const log = document.getElementById('log');
const statusDot = document.getElementById('statusDot');
const sizeSlider = document.getElementById('sizeSlider');
const liveOriginal = document.getElementById('live-original');

let translationHistory = ["", "", "", ""];
let isProcessing = false;

// Recuperar llave guardada para comodidad
if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

// Control de tamaño en tiempo real
sizeSlider.oninput = () => {
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = sizeSlider.value + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { updateLog("Error: Pega la llave", "bg-red-500"); return; }
    localStorage.setItem('church_key', key);
    updateLog("Buscando...", "bg-yellow-500");
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await response.json();
        if (data.models) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
                if (m.supportedGenerationMethods.includes('generateContent')) {
                    const name = m.name.replace('models/', '');
                    const opt = new Option(name, name);
                    if (name.includes('flash')) opt.selected = true;
                    modelSelect.add(opt);
                }
            });
            updateLog("Modelos cargados", "bg-green-500");
        } else { 
            const errorMsg = data.error ? data.error.message : "Error de API";
            updateLog(errorMsg, "bg-red-500"); 
        }
    } catch (e) { updateLog("Sin conexión con Google", "bg-red-500"); }
}

function updateLog(msg, colorClass) {
    log.innerText = msg;
    statusDot.className = `status-dot ${colorClass}`;
}

async function translateChunk(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value || "gemini-1.5-flash"; 
    const mode = languageMode.value;
    
    if (!key || isProcessing || text.trim().split(' ').length < 2) return;
    
    isProcessing = true;
    updateLog("Traduciendo...", "bg-blue-500");

    const sourceLang = mode === "es-EN" ? "Spanish" : "English";
    const targetLang = mode === "es-EN" ? "English" : "Spanish";

    const prompt = `Translate exactly this ${sourceLang} church sermon segment to ${targetLang}. 
    Maintain a sacred and solemn tone. ONLY output the translation. No notes. No explanations. 
    TEXT: "${text}"`;

    try {
        // Intentamos con v1beta que es la más flexible
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            updateDisplay(result);
            updateLog("En línea", "bg-green-500");
        } else {
            const errorDetail = data.error ? data.error.message : "Google no respondió correctamente";
            updateLog(errorDetail, "bg-orange-500");
        }
    } catch (e) { 
        console.error("Error IA:", e);
        updateLog("Error de Red", "bg-red-500"); 
    } finally { 
        isProcessing = false; 
    }
}

function updateDisplay(newText) {
    if (newText === translationHistory[0]) return;
    
    translationHistory.unshift(newText);
    if(translationHistory.length > 4) translationHistory.pop();
    
    for(let i = 0; i < 4; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        updateLog("Navegador no soportado", "bg-red-500");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    
    const mode = languageMode.value;
    recognition.lang = (mode === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        
        liveOriginal.innerText = interim || final;

        // Traducir bloques de texto para que sea fluido
        if (final) {
            translateChunk(final);
        } else if (interim.split(' ').length > 8) { 
            // Si el pastor habla mucho sin hacer pausa final, enviamos el bloque
            if (!isProcessing) translateChunk(interim);
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => { 
        console.error("Error micro:", e.error); 
        if(e.error === 'not-allowed') updateLog("Permiso de micro denegado", "bg-red-500");
    };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "2. INICIAR MICRO";
        document.getElementById('btnStart').classList.remove('btn-active');
        updateLog("Micrófono apagado", "bg-gray-600");
    } else {
        initRecognition();
        try {
            recognition.start();
            isRecording = true;
            document.getElementById('btnStart').innerText = "DETENER MICRO";
            document.getElementById('btnStart').classList.add('btn-active');
            updateLog("Escuchando...", "bg-green-500");
        } catch(e) {
            updateLog("Error al iniciar", "bg-red-500");
        }
    }
};

// Cambiar idioma reinicia el micro automáticamente
languageMode.onchange = () => {
    if (isRecording) { recognition.stop(); setTimeout(() => document.getElementById('btnStart').click(), 400); }
};

// Inicializar tamaño
sizeSlider.oninput();
</script>
</body>
</html>
