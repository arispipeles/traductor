<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Church Translator - Final Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        /* */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fbbf24; /* Amarillo vibrante para el televisor */
            overflow: hidden; 
            height: 100vh; 
            margin: 0; 
        }
        .text-huge { 
            font-size: 14vw; 
            line-height: 1.1; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center;
            word-wrap: break-word;
            padding: 0 5%;
        }
        .cursor-blink { 
            animation: blink 1s infinite; 
            border-left: 15px solid #fbbf24; 
            margin-left: 10px; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #controls { 
            opacity: 0; 
            transition: opacity 0.3s; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(20, 20, 20, 0.9); 
            padding: 15px; 
            z-index: 100; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 2px solid #333; 
        }
        #controls:hover { opacity: 1; }
        .error-log {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #7f1d1d;
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            display: none;
            font-size: 14px;
            z-index: 200;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

<div id="controls">
    <button id="btnStart" class="bg-green-600 hover:bg-green-500 px-8 py-3 rounded-full font-bold text-white transition-all transform active:scale-95">INICIAR MICRO</button>
    <select id="langMode" class="bg-gray-800 text-white px-4 py-2 rounded-xl border border-gray-600 outline-none">
        <option value="es-EN">Español ➔ Inglés</option>
        <option value="en-ES">Inglés ➔ Español</option>
    </select>
    <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">Tamaño:</span>
        <input type="range" id="sizeSlider" min="5" max="25" value="14" class="w-32 accent-yellow-500">
    </div>
    <div class="flex flex-col ml-4">
        <input type="password" id="apiKeyInput" value="AIzaSyDJp_CbgA7C3mBJ9TQCUynjaAS6bzPQyyw" class="bg-gray-900 text-[10px] text-gray-500 px-2 py-1 rounded border border-gray-700 w-40" placeholder="API KEY">
    </div>
</div>

<div class="flex flex-col justify-center items-center h-screen">
    <div id="original" class="text-white opacity-20 text-3xl italic mb-6 h-10 text-center px-10"></div>
    <div id="translated" class="text-huge">
        BIENVENIDOS
        <span class="cursor-blink"></span>
    </div>
</div>

<div id="errorBox" class="error-log"></div>

<script>
/* */
let recognition;
let isRecording = false;

const btnStart = document.getElementById('btnStart');
const translated = document.getElementById('translated');
const original = document.getElementById('original');
const errorBox = document.getElementById('errorBox');
const sizeSlider = document.getElementById('sizeSlider');
const apiKeyInput = document.getElementById('apiKeyInput');

function showError(msg) {
    console.error(msg);
    errorBox.innerHTML = `<strong>Aviso:</strong> ${msg}`;
    errorBox.style.display = 'block';
    setTimeout(() => { errorBox.style.display = 'none'; }, 10000);
}

/* */
async function translateText(text) {
    if (text.trim().length < 2) return;
    
    const key = apiKeyInput.value.trim();
    const isEsToEn = document.getElementById('langMode').value === 'es-EN';
    const source = isEsToEn ? "Spanish" : "English";
    const target = isEsToEn ? "English" : "Spanish";

    // URL corregida con el formato exacto que pide Google para v1beta
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: `Translate this church sermon from ${source} to ${target}. ONLY output the translation, no quotes, no explanations: "${text}"`
                    }]
                }]
            })
        });

        const data = await response.json();
        
        if (data.error) {
            showError(`Google dice: ${data.error.message}`);
            return;
        }

        if (data.candidates && data.candidates[0].content) {
            const result = data.candidates[0].content.parts[0].text;
            translated.innerHTML = `${result.toUpperCase()}<span class="cursor-blink"></span>`;
            errorBox.style.display = 'none';
        }
    } catch (e) {
        showError("Error de conexión. Revisa tu internet.");
    }
}

/* */
function initSpeech() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        showError("Este navegador no soporta voz. Usa Chrome en tu Mac.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        if (final) {
            original.innerText = final;
            translateText(final);
        } else {
            original.innerText = interim;
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => {
        if (e.error === 'not-allowed') showError("Debes permitir el micrófono en el candado de la barra de direcciones.");
    };
}

/* */
btnStart.onclick = () => {
    if (!recognition) initSpeech();
    if (!isRecording) {
        recognition.lang = document.getElementById('langMode').value === 'es-EN' ? 'es-ES' : 'en-US';
        try {
            recognition.start();
            isRecording = true;
            btnStart.innerText = "DETENER";
            btnStart.classList.replace('bg-green-600', 'bg-red-600');
        } catch (err) {
            console.log("Ya estaba iniciado");
        }
    } else {
        recognition.stop();
        isRecording = false;
        btnStart.innerText = "INICIAR MICRO";
        btnStart.classList.replace('bg-red-600', 'bg-green-600');
    }
};

sizeSlider.oninput = (e) => {
    translated.style.fontSize = `${e.target.value}vw`;
};
</script>

</body>
</html>
