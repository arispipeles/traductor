<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia - Edición de Rescate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        #admin-panel { 
            background: rgba(20, 20, 20, 0.95); 
            border-bottom: 2px solid #444; 
            padding: 15px; 
            display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center;
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        #display-area {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; padding: 0 5%; text-align: center;
        }

        .translation-text {
            font-weight: 900; text-transform: uppercase; line-height: 1;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.4); width: 100%;
        }

        .live-gray-text { color: #555; font-size: 2.5rem; margin-bottom: 1.5rem; min-height: 3.5rem; font-style: italic; }

        /* Monitor de Audio */
        #audio-monitor {
            width: 100px; height: 30px; background: #222; border-radius: 5px; overflow: hidden; display: flex; align-items: flex-end; gap: 2px; padding: 2px;
        }
        .bar { width: 8px; background: #10b981; min-height: 2px; transition: height 0.1s; }
        
        input, select { background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="admin-panel">
    <div class="flex flex-col items-center">
        <span class="text-[10px] text-gray-500 font-bold uppercase">1. Monitor de Micrófono</span>
        <div id="audio-monitor">
            <div class="bar" style="height: 10%"></div><div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 80%"></div><div class="bar" style="height: 30%"></div>
            <div class="bar" style="height: 60%"></div><div class="bar" style="height: 20%"></div>
        </div>
    </div>

    <div class="flex flex-col">
        <span class="text-[10px] text-gray-500 font-bold uppercase">2. API Key</span>
        <input type="password" id="apiKey" placeholder="Pega tu clave aquí...">
    </div>

    <div class="flex flex-col">
        <span class="text-[10px] text-gray-500 font-bold uppercase">3. Tamaño Texto</span>
        <input type="range" id="sizeSlider" min="5" max="25" value="13" class="w-32">
    </div>

    <button id="btnStart" class="bg-green-600 text-white px-6 py-3 rounded-xl font-black hover:bg-green-500 transition-all">INICIAR SISTEMA</button>
    
    <div id="status" class="text-xs font-mono px-3 py-2 bg-black rounded border border-gray-700">
        ESTADO: <span id="statusText" class="text-gray-500">APAGADO</span>
    </div>
</div>

<div id="display-area">
    <div id="live-text" class="live-gray-text">EL TEXTO APARECERÁ AQUÍ...</div>
    <div id="translated-text" class="translation-text" style="font-size: 13vw;">
        LISTO PARA TRADUCIR
    </div>
</div>

<script>
let recognition;
let isRecording = false;
let audioContext;
let analyser;
let microphone;
let lastTranslationTime = 0;
let accumulatedText = "";

const statusText = document.getElementById('statusText');
const liveDisplay = document.getElementById('live-text');
const translatedDisplay = document.getElementById('translated-text');
const sizeSlider = document.getElementById('sizeSlider');
const bars = document.querySelectorAll('.bar');

// Recuperar API Key guardada
if(localStorage.getItem('church_key')) document.getElementById('apiKey').value = localStorage.getItem('church_key');

sizeSlider.oninput = (e) => { translatedDisplay.style.fontSize = e.target.value + 'vw'; };

async function startAudioMonitor() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 32;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function updateBars() {
            analyser.getByteFrequencyData(dataArray);
            bars.forEach((bar, i) => {
                const val = dataArray[i] || 0;
                bar.style.height = (val / 2) + '%';
            });
            if(isRecording) requestAnimationFrame(updateBars);
        }
        updateBars();
    } catch (err) {
        console.error("Error acceso audio:", err);
        alert("No se pudo acceder al micrófono físico.");
    }
}

async function callGemini(text) {
    const key = document.getElementById('apiKey').value.trim();
    if (!key || text.length < 10) return;

    const now = Date.now();
    if (now - lastTranslationTime < 5000) return; // Máximo 1 vez cada 5 segundos

    lastTranslationTime = now;
    statusText.innerText = "TRADUCIENDO...";
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Translate to English. Only the translation: "${text}"` }] }]
            })
        });
        const data = await response.json();
        const result = data.candidates[0].content.parts[0].text;
        translatedDisplay.innerText = result.toUpperCase();
        statusText.innerText = "OK - ESCUCHANDO";
        accumulatedText = ""; // Limpiar buffer
    } catch (e) {
        statusText.innerText = "ERROR API";
    }
}

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) return alert("Usa Chrome.");

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-ES';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }

        // MOSTRAR LO QUE SE ESCUCHA (TEXTO GRIS)
        if (interim || final) {
            liveDisplay.innerText = interim || final;
        }

        if (final) {
            accumulatedText += " " + final;
            if (accumulatedText.split(' ').length > 4) {
                callGemini(accumulatedText);
            }
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => { console.log("Error Speech:", e.error); };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        location.reload(); // Reinicio total para limpiar memoria
    } else {
        const key = document.getElementById('apiKey').value.trim();
        if(!key) return alert("Pon tu API Key primero");
        localStorage.setItem('church_key', key);

        initRecognition();
        startAudioMonitor();
        
        recognition.start();
        isRecording = true;
        document.getElementById('btnStart').innerText = "REINICIAR TODO";
        document.getElementById('btnStart').className = "bg-red-600 text-white px-6 py-3 rounded-xl font-black";
        statusText.innerText = "SISTEMA ACTIVO";
        statusText.className = "text-green-500";
    }
};
</script>
</body>
</html>
