!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Iglesia Pro - Streaming Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fbbf24; margin: 0; overflow: hidden; height: 100vh; }
        
        #subtitle-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            padding: 0 5%;
            text-align: center;
            gap: 1rem;
        }

        .translation-line {
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.5s ease-out;
            width: 100%;
        }

        /* Efecto de profundidad para el televisor de 75" */
        .line-0 { opacity: 1; color: #fbbf24; text-shadow: 0 0 40px rgba(251, 191, 36, 0.5); transform: scale(1.05); }
        .line-1 { opacity: 0.6; color: #f59e0b; transform: scale(0.95); }
        .line-2 { opacity: 0.3; color: #d97706; transform: scale(0.85); }
        .line-3 { opacity: 0.15; color: #b45309; transform: scale(0.75); }

        #admin-panel { 
            background: rgba(17, 17, 17, 0.95); 
            border-bottom: 2px solid #333; 
            padding: 12px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 1000; 
            transition: 0.3s;
        }
        
        .hidden-panel { transform: translateY(-100%); position: absolute; width: 100%; }
        .live-preview { color: #555; font-style: italic; height: 30px; font-size: 1.2rem; text-align: center; margin-top: 10px; overflow: hidden; }
        
        select, input, button { border-radius: 12px; padding: 8px 16px; border: 1px solid #444; font-weight: bold; }
        .btn-active { background: #b91c1c !important; border-color: #ef4444; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; background: #222; padding: 5px 15px; border-radius: 20px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot-green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-blue { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .dot-red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body>

<div id="admin-panel">
    <input type="password" id="apiKeyInput" placeholder="Pega tu API Key..." class="bg-black text-yellow-500 w-48 outline-none border-yellow-900/50">
    
    <button onclick="discoverModels()" class="bg-blue-700 hover:bg-blue-600 text-white transition-all shadow-lg">
        1. BUSCAR MODELOS
    </button>

    <select id="modelSelect" class="bg-black text-white w-44 outline-none border-gray-700">
        <option value="">Selecciona modelo...</option>
    </select>

    <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded-xl">
        <label class="text-gray-500 text-[10px] uppercase">Dirección:</label>
        <select id="languageMode" class="bg-transparent text-white outline-none">
            <option value="es-EN">Español ➔ Inglés</option>
            <option value="en-ES">Inglés ➔ Español</option>
        </select>
    </div>

    <div class="flex items-center gap-3 bg-gray-900 px-4 py-1 rounded-xl">
        <label class="text-gray-500 text-[10px] uppercase">Tamaño:</label>
        <input type="range" id="sizeSlider" min="5" max="25" value="12" step="0.5" class="w-32 accent-yellow-500">
    </div>

    <button id="btnStart" class="bg-green-700 hover:bg-green-600 text-white px-6 rounded-full transition-all">
        2. INICIAR MICRO
    </button>
    
    <button onclick="togglePanel()" class="bg-gray-800 text-gray-400 hover:text-white border-none">OCULTAR</button>
    
    <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="log">Listo</span>
    </div>
</div>

<div class="h-full flex flex-col cursor-pointer" onclick="togglePanel()">
    <!-- Vista previa de lo que escucha el micro -->
    <div id="live-original" class="live-preview">Esperando voz del pastor...</div>
    
    <!-- Contenedor de las 4 líneas de traducción -->
    <div id="subtitle-container">
        <div id="line-0" class="translation-line line-0">BIENVENIDOS</div>
        <div id="line-1" class="translation-line line-1">WELCOME</div>
        <div id="line-2" class="translation-line line-2"></div>
        <div id="line-3" class="translation-line line-3"></div>
    </div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKeyInput');
const modelSelect = document.getElementById('modelSelect');
const languageMode = document.getElementById('languageMode');
const log = document.getElementById('log');
const statusDot = document.getElementById('statusDot');
const sizeSlider = document.getElementById('sizeSlider');
const liveOriginal = document.getElementById('live-original');

let translationHistory = ["", "", "", ""];
let isProcessing = false;
let lastRequestTime = 0;
const MIN_REQUEST_INTERVAL = 4500; // 4.5 segundos entre peticiones para NO agotar la cuota (Máx 13-15 RPM)
let textBuffer = "";

// Cargar llave guardada
if(localStorage.getItem('church_key')) apiKeyInput.value = localStorage.getItem('church_key');

function togglePanel() { document.getElementById('admin-panel').classList.toggle('hidden-panel'); }

sizeSlider.oninput = () => {
    document.querySelectorAll('.translation-line').forEach(line => {
        line.style.fontSize = sizeSlider.value + 'vw';
    });
};

async function discoverModels() {
    const key = apiKeyInput.value.trim();
    if (!key) { updateStatus("Pega tu API Key primero", "red"); return; }
    localStorage.setItem('church_key', key);
    updateStatus("Buscando modelos...", "blue");
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const data = await response.json();
        if (data.models) {
            modelSelect.innerHTML = '';
            data.models.forEach(m => {
                if (m.supportedGenerationMethods.includes('generateContent')) {
                    const name = m.name.replace('models/', '');
                    const opt = new Option(name, name);
                    if (name.includes('flash')) opt.selected = true;
                    modelSelect.add(opt);
                }
            });
            updateStatus("Modelos cargados", "green");
        } else {
            updateStatus("Error: " + (data.error?.message || "Llave inválida"), "red");
        }
    } catch (e) { updateStatus("Sin conexión", "red"); }
}

function updateStatus(msg, color) {
    log.innerText = msg;
    statusDot.className = `dot dot-${color}`;
}

async function translateWithIA(text) {
    const key = apiKeyInput.value.trim();
    const model = modelSelect.value || "gemini-1.5-flash";
    const mode = languageMode.value;
    const now = Date.now();

    // 1. Validaciones básicas
    if (!key || isProcessing || text.trim().length < 5) return;

    // 2. Control de Cuota: Si se intenta enviar muy rápido, esperamos.
    const timeSinceLast = now - lastRequestTime;
    if (timeSinceLast < MIN_REQUEST_INTERVAL) {
        updateStatus("Esperando turno (Cuota)...", "blue");
        return; 
    }

    isProcessing = true;
    lastRequestTime = Date.now();
    updateStatus("Traduciendo...", "blue");

    const source = mode === "es-EN" ? "Spanish" : "English";
    const target = mode === "es-EN" ? "English" : "Spanish";

    const prompt = `Translate this church sermon segment from ${source} to ${target}. 
    Be solemn and sacred. ONLY output the translation. NO explanations. 
    TEXT: "${text}"`;

    try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0]) {
            const result = data.candidates[0].content.parts[0].text.trim();
            updateDisplay(result);
            updateStatus("En línea", "green");
            textBuffer = ""; // Limpiamos buffer tras éxito
        } else if (data.error) {
            // Si sale error de cuota, avisamos visualmente
            if(data.error.message.includes("quota")) {
                updateStatus("Límite alcanzado. Pausando 10s...", "red");
                lastRequestTime += 10000; // Penalización de tiempo extra
            } else {
                updateStatus("Google dice: " + data.error.message.substring(0,30), "red");
            }
        }
    } catch (e) {
        updateStatus("Error de red", "red");
    } finally {
        isProcessing = false;
    }
}

function updateDisplay(newText) {
    if (!newText || newText === translationHistory[0]) return;
    translationHistory.unshift(newText);
    if(translationHistory.length > 4) translationHistory.pop();
    
    for(let i = 0; i < 4; i++) {
        document.getElementById(`line-${i}`).innerText = translationHistory[i] || "";
    }
}

let recognition;
let isRecording = false;

function initRecognition() {
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!window.SpeechRecognition) {
        updateStatus("Navegador no compatible", "red");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    
    const mode = languageMode.value;
    recognition.lang = (mode === "es-EN") ? 'es-ES' : 'en-US';

    recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
        }
        
        liveOriginal.innerText = interim || final;

        // Estrategia de envío:
        if (final) {
            textBuffer += " " + final;
            // Solo enviamos si el buffer tiene un tamaño decente para ahorrar cuota
            if (textBuffer.split(' ').length > 5) {
                translateWithIA(textBuffer);
            }
        } else if (interim.split(' ').length > 15) {
            // Si el pastor no hace pausas, forzamos envío cada 15 palabras
            translateWithIA(interim);
        }
    };

    recognition.onend = () => { if (isRecording) recognition.start(); };
    recognition.onerror = (e) => { console.error("Error Micro:", e.error); };
}

document.getElementById('btnStart').onclick = () => {
    if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('btnStart').innerText = "2. INICIAR MICRO";
        document.getElementById('btnStart').classList.remove('btn-active');
        updateStatus("Micrófono apagado", "red");
    } else {
        if (!modelSelect.value) {
            updateStatus("¡Busca y selecciona un modelo!", "red");
            return;
        }
        initRecognition();
        try {
            recognition.start();
            isRecording = true;
            document.getElementById('btnStart').innerText = "DETENER MICRO";
            document.getElementById('btnStart').classList.add('btn-active');
            updateStatus("Escuchando...", "green");
        } catch(e) { updateStatus("Error al iniciar", "red"); }
    }
};

// Reiniciar micro si cambia el idioma
languageMode.onchange = () => {
    if (isRecording) { recognition.stop(); setTimeout(() => document.getElementById('btnStart').click(), 500); }
};

// Ajuste inicial de tamaño
sizeSlider.oninput();
</script>
</body>
</html>
